    '<div class="irow'+(many?' multi':'')+'"><span class="flabel" id="f-pl">Paid by</span><div class="pp'+(many?' many':'')+'" role="radiogroup" aria-labelledby="f-pl">'+
      P.map(function(p,i){return '<button class="pbtn" role="radio" data-p="'+i+'">'+who(i)+'</button>'}).join('')+
    '</div></div>'+
    (many?'<div class="irow multi" id="f-torow" hidden><span class="flabel" id="f-tl">To</span><div class="pp many" role="radiogroup" aria-labelledby="f-tl">'+
      P.map(function(p,i){return '<button class="pbtn" role="radio" data-to="'+i+'">'+who(i)+'</button>'}).join('')+'</div></div>':'')+
    '<p class="pnote" id="f-pnote" hidden></p>'+
    '<div class="split-block" id="f-split"><div class="irow'+(many?' multi':'')+'"><span class="flabel" id="f-sl">Split</span><div class="chips" role="group" aria-labelledby="f-sl">'+
        '<button class="chip" id="f-all">Shared by all</button>'+
        P.map(function(p,i){return '<button class="chip pt" data-w="'+i+'" aria-label="'+esc(p.name)+' shares this">'+who(i)+'</button>'}).join('')+
      '</div></div>'+
      '<p class="eqr" id="f-eqr" aria-live="polite"></p>'+
      '<div id="f-pair"><div class="sbar" id="f-sbar"><div class="st"><span class="s0" id="f-s0"></span><span class="s1" id="f-s1"></span></div><span class="hd" id="f-hd"></span>'+
        '<input type="range" id="f-a" min="0" max="100" step="1"></div>'+
      '<div class="sread"><span><span class="nm"><span id="f-n0"></span> <span id="f-pc0" class="mono"></span></span><span class="mono" id="f-v0"></span></span><span><span class="nm"><span id="f-n1"></span> <span id="f-pc1" class="mono"></span></span><span class="mono" id="f-v1"></span></span></div></div>'+
      '<p class="error-msg" id="f-split-err" hidden></p>'+
    '</div>'+
    (isEdit?'<div class="sheet-actions"><button class="btn btn-ghost danger" id="f-del">'+icon('trash')+'Delete</button></div>':'');
  var foot=(TOUCH?'<div class="kp" id="f-kp" role="group" aria-label="Number pad">'+
      ['1','2','3','4','5','6','7','8','9'].map(function(k){return '<button type="button" data-k="'+k+'">'+k+'</button>'}).join('')+
      '<button type="button" data-k="." id="kp-x" class="k-fn">.</button><button type="button" data-k="0">0</button>'+
      '<button type="button" data-k="del" id="kp-del" class="k-fn" aria-label="Delete digit (hold to keep deleting)">'+icon('arrow-left','lg')+'</button></div>':'')+
    '<button class="btn btn-primary" id="f-save"></button>';

  openSheet(isEdit?(e.kind==='payment'?'Edit payment':'Edit expense'):'New entry',body,function(sh){
    var amt=$('#f-amt',sh);
    if(isEdit)amt.value=group(inputStr(e.amount,e.cur));
    $('#f-desc',sh).value=d.desc;$('#f-date',sh).value=d.date;$('#f-a',sh).value=d.a;

    function amount(){return parseAmount(amt.value,d.cur)}
    function setA(v,snap){d.a=Math.max(0,Math.min(100,Math.round(v)));if(snap&&Math.abs(d.a-50)<=2)d.a=50;splitTouched=true;$('#f-a',sh).value=d.a;upd()}
    function showAmt(){if(!TOUCH)return;var v=amt.value;$('#f-amtt',sh).textContent=v;$('#f-amtph',sh).hidden=!!v}
    function upd(){
      var pay=d.kind==='payment';
      if(d.to===d.payer)d.to=d.payer?0:1;
      $$('#f-kind button',sh).forEach(function(b){b.classList.toggle('active',b.dataset.k===d.kind)});
      $$('#f-cur button',sh).forEach(function(b){b.classList.toggle('active',b.dataset.c===d.cur)});
      $('#f-sym',sh).textContent=CUR[d.cur].sym;kpKeys();showAmt();
      $$('.pbtn[data-p]',sh).forEach(function(b){b.setAttribute('aria-checked',String(+b.dataset.p===d.payer))});
      $$('.pbtn[data-to]',sh).forEach(function(b){var i=+b.dataset.to;b.setAttribute('aria-checked',String(i===d.to));b.disabled=i===d.payer});
      $('#f-pl',sh).textContent=pay?(many?'From':'Paid back'):'Paid by';
      var tr=$('#f-torow',sh);if(tr)tr.hidden=!pay;
      var pn=$('#f-pnote',sh);pn.hidden=!pay||many;if(pay)pn.textContent=P[d.payer].name+' pays '+P[d.to].name+'.';
      $('#f-split',sh).hidden=pay;
      $('#f-save',sh).textContent=isEdit?'Save changes':(pay?'Record payment':'Add expense');
      var a=amount();var r=isEdit&&e.cur===d.cur&&e.rate?e.rate:rateFor(t,d.cur);
      var conv=$('#f-conv',sh);
      if(a.minor)conv.textContent=d.cur==='HKD'?'':'= '+fmt(toBase(a.minor,d.cur,r),'HKD')+'  at '+rateText(d.cur,r);
      else conv.textContent=d.cur==='HKD'?'':rateText(d.cur,r);
      /* split */
      var k=d.who.length,m=a.minor||0;
      $('#f-all',sh).setAttribute('aria-pressed',String(k===N&&(k!==2||d.a===50)));
      $$('.chip.pt',sh).forEach(function(c){c.setAttribute('aria-pressed',String(d.who.indexOf(+c.dataset.w)>=0))});
      var pair=k===2,eqr=$('#f-eqr',sh);
      $('#f-pair',sh).hidden=!pair;eqr.hidden=pair;
      if(!k)eqr.textContent='Tap the people who share this.';
      else if(k===1)eqr.textContent='For '+P[d.who[0]].name+' only'+(m?' · '+fmt(m,d.cur):'');
      else if(!pair)eqr.textContent=(m?(m%k?'≈ ':'')+fmt(Math.floor(m/k),d.cur)+' each · ':'')+k+' people'+(k===N?'':' of '+N);
      if(pair){
        var i0=d.who[0],i1=d.who[1];
        $('#f-s0',sh).style.background='var(--p'+i0+')';$('#f-s1',sh).style.background='var(--p'+i1+')';
        $('#f-s0',sh).style.width=d.a+'%';$('#f-s0',sh).style.display=d.a?'':'none';$('#f-s1',sh).style.display=d.a<100?'':'none';
        $('#f-hd',sh).style.left='calc(4px + (100% - 8px) * '+(d.a/100)+')';
        $('#f-a',sh).setAttribute('aria-label',P[i0].name+'’s share, percent');
        $('#f-n0',sh).textContent=P[i0].name;$('#f-n1',sh).textContent=P[i1].name;
        $('#f-pc0',sh).textContent=d.a+'%';$('#f-pc1',sh).textContent=(100-d.a)+'%';
        var sp=m?splitPct(m,d.a):[0,0];
        $('#f-v0',sh).textContent=fmt(sp[0],d.cur);$('#f-v1',sh).textContent=fmt(sp[1],d.cur);
      }
    }
    function err(id,msg){var el=$(id,sh);el.hidden=!msg;el.textContent=msg||''}

    /* number pad (touch screens): keys act on touch-down; delete repeats while held */
    var kp=$('#f-kp',sh),kpOn=false;
    function setT(on){
      kpOn=TOUCH&&!!on;
      $('#f-amtw',sh).classList.toggle('kp-on',kpOn);
      if(kp){kp.hidden=!kpOn;kpKeys()}
    }
    function kpKeys(){if(!kp)return;var x=$('#kp-x',sh);var dp=CUR[d.cur].dp;x.dataset.k=dp?'.':'000';x.textContent=dp?'.':'000';x.setAttribute('aria-label',dp?'Decimal point':'Three zeros')}
    function focusAmt(){if(TOUCH)setT(true);else amt.focus()}
    function press(k){
      var dp=CUR[d.cur].dp;var raw=amt.value.replace(/,/g,'');
      if(k==='del'){if(!raw)return;raw=raw.slice(0,-1)}
      else if(k==='.'){if(!dp||raw.indexOf('.')>=0)return;raw=(raw||'0')+'.'}
      else if(k==='000'){if(!raw||raw==='0'||raw.indexOf('.')>=0)return;raw+='000'}
      else{if(raw.indexOf('.')>=0&&raw.split('.')[1].length>=dp)return;raw=raw==='0'?k:raw+k}
      if(raw.replace('.','').length>13)return;
      amt.value=group(raw);amt.dispatchEvent(new Event('input',{bubbles:true}));
    }
    if(kp){
      $$('button',kp).forEach(function(b){
        var delay=null,rep=null;
        function stop(){clearTimeout(delay);clearInterval(rep);delay=rep=null}
        b.addEventListener('pointerdown',function(ev){
          ev.preventDefault();if(!kpOn)setT(true);
          var k=b.dataset.k;press(k);
          if(k==='del'){stop();delay=setTimeout(function(){rep=setInterval(function(){press('del')},75)},420)}
        });
        ['pointerup','pointercancel','pointerleave','lostpointercapture'].forEach(function(n){b.addEventListener(n,stop)});
        b.addEventListener('click',function(ev){if(ev.detail===0)press(b.dataset.k)});   /* keyboard / switch access */
        b.addEventListener('contextmenu',function(ev){ev.preventDefault()});
      });
      $('#f-amtw',sh).addEventListener('click',function(){setT(true)});
      $('#f-amtd',sh).addEventListener('keydown',function(ev){if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();setT(true)}});
      [$('#f-desc',sh),$('#f-date',sh)].forEach(function(x){x.addEventListener('focus',function(){setT(false)})});
    }

    /* repayments: fill in what the settle-up list says this pair owes */
    function fillPay(base){var m=fromBase(base,d.cur,rateFor(t,d.cur));if(m>0){amt.value=group(inputStr(m,d.cur));prefill={minor:m,cur:d.cur,base:base}}}
    function refill(){
      if(isEdit||d.kind!=='payment')return;
      if(amt.value&&!(prefill&&prefill.cur===d.cur&&amount().minor===prefill.minor))return;
      var tr=calc(tabEntries(t),N).transfers.filter(function(x){return x.from===d.payer&&x.to===d.to})[0];
      if(tr)fillPay(tr.amt);else if(prefill){amt.value='';prefill=null}
    }
    $$('#f-kind button',sh).forEach(function(b){b.addEventListener('click',function(){
      d.kind=b.dataset.k;
      if(d.kind==='payment'&&!isEdit&&!amt.value){
        var tr=calc(tabEntries(t),N).transfers;
        if(tr.length){d.payer=tr[0].from;d.to=tr[0].to;fillPay(tr[0].amt)}
      }
      upd();
    })});
    $$('#f-cur button',sh).forEach(function(b){b.addEventListener('click',function(){
      var old=d.cur;d.cur=b.dataset.c;
      if(prefill&&prefill.cur===old&&amount().minor===prefill.minor){var m=fromBase(prefill.base,d.cur,rateFor(t,d.cur));amt.value=group(inputStr(m,d.cur));prefill={minor:m,cur:d.cur,base:prefill.base}}
      else if(!CUR[d.cur].dp&&amt.value.indexOf('.')>=0){amt.value=amt.value.split('.')[0]}
      err('#f-amt-err','');upd();focusAmt();
    })});
    amt.addEventListener('input',function(){err('#f-amt-err','');upd()});
    amt.addEventListener('keydown',function(ev){if(ev.key==='Enter'){ev.preventDefault();$('#f-desc',sh).focus()}});
    $('#f-desc',sh).addEventListener('keydown',function(ev){if(ev.key==='Enter'){ev.preventDefault();save()}});
    $$('.pbtn[data-p]',sh).forEach(function(b){b.addEventListener('click',function(){d.payer=+b.dataset.p;if(d.to===d.payer)d.to=d.payer?0:1;refill();upd()})});
    $$('.pbtn[data-to]',sh).forEach(function(b){b.addEventListener('click',function(){if(b.disabled)return;d.to=+b.dataset.to;refill();upd()})});
    $('#f-all',sh).addEventListener('click',function(){d.who=ALL.slice();d.a=50;splitTouched=true;err('#f-split-err','');upd()});
    $$('.chip.pt',sh).forEach(function(c){c.addEventListener('click',function(){
      var i=+c.dataset.w,j=d.who.indexOf(i);
      if(j>=0)d.who.splice(j,1);else{d.who.push(i);d.who.sort(function(x,y){return x-y})}
      d.a=50;splitTouched=true;err('#f-split-err','');upd();
    })});
    var bar=$('#f-sbar',sh);var drag=false;
    function fromX(x){var r=bar.getBoundingClientRect();setA((x-r.left)/r.width*100,true)}
    bar.addEventListener('pointerdown',function(ev){drag=true;try{bar.setPointerCapture(ev.pointerId)}catch(_){}fromX(ev.clientX)});
    bar.addEventListener('pointermove',function(ev){if(drag)fromX(ev.clientX)});
    bar.addEventListener('pointerup',function(){drag=false});bar.addEventListener('pointercancel',function(){drag=false});
    $('#f-a',sh).addEventListener('input',function(ev){d.a=+ev.target.value;splitTouched=true;upd()});
    $('#f-save',sh).addEventListener('click',save);
    if(isEdit)$('#f-del',sh).addEventListener('click',function(){
      var gone=e;put('entries',e.id,null);closeSheet();
      toast('Deleted · '+(gone.desc||(gone.kind==='payment'?'payment':'expense')),null,{label:'Undo',fn:function(){put('entries',gone.id,gone)}});
    });

    function save(){
      var a=amount();if(a.err){err('#f-amt-err',a.err);focusAmt();return}
      var keepRate=isEdit&&e.cur===d.cur&&e.rate;var rate=d.cur==='HKD'?null:(keepRate?e.rate:rateFor(t,d.cur));
      var base=toBase(a.minor,d.cur,rate);
      if(d.kind==='payment'&&prefill&&prefill.cur===d.cur&&prefill.minor===a.minor)base=prefill.base;
      if(base<=0){err('#f-amt-err','That amount is below HK$0.01.');return}
      var split=null;
      if(d.kind==='expense'){
        if(!d.who.length){err('#f-split-err','Pick at least one person to share this.');return}
        /* an older exact-amount split stays as it was unless the split or the amount changed */
        if(orig&&orig.mode==='exact'&&!splitTouched&&a.minor===e.amount&&d.cur===e.cur)split=orig;
        else if(d.who.length===2&&d.a!==50)split={mode:'pct',a:d.a,who:d.who.slice()};
        else split={mode:'eq',who:d.who.slice()};
      }
      var date=$('#f-date',sh).value||todayISO();
      var now=Date.now();
      var rec={id:isEdit?e.id:uid(),tabId:t.id,kind:d.kind,date:date,desc:$('#f-desc',sh).value.trim(),amount:a.minor,cur:d.cur,rate:rate,base:base,payer:d.payer,split:split,createdAt:isEdit?e.createdAt:now,updatedAt:now};
      if(d.kind==='payment')rec.to=d.to;
      put('entries',rec.id,rec);
      if(!isEdit)setLast(t,{cur:d.cur,payer:d.kind==='expense'?d.payer:lp});
      closeSheet();
      toast((isEdit?'Saved':'Added')+' · '+fmt(a.minor,d.cur));
    }
    if(pre&&!isEdit&&pre.base)fillPay(pre.base);
    upd();
    if(!isEdit&&!pre)focusAmt();else setT(false);
  },foot);
}

/* ── tab sheet (new / edit) ────────────────────────────── */
/* New tabs start with the people from the most recent tab; a first-time user sees You and Friend.
   v0.5: 2 to 10 people, each with their own colour. Someone who is on an entry cannot be removed. */
function defaultPeople(){var l=tabList();if(l.length)return clone(l[0].people);return [{name:'You',colour:SWATCHES[AUTO_ORDER[0]][0]},{name:'Friend',colour:SWATCHES[AUTO_ORDER[1]][0]}]}
function entriesWith(t,i){return tabEntries(t).filter(function(e){return e.payer===i||(e.kind==='payment'?payTo(e)===i:splitWho(e).indexOf(i)>=0)}).length}
function tabSheet(t){
  var isEdit=!!t;
  var d=isEdit?clone(t):{name:'',start:todayISO(),end:'',people:defaultPeople(),currencies:['HKD','USD','IDR'],rates:{USD:DEFAULT_RATES.USD,IDR:DEFAULT_RATES.IDR},defCur:'HKD',settled:false};
  d.rates=d.rates||{};
  d.people=d.people.map(function(p,i){return {name:p.name,colour:p.colour,o:isEdit?i:null}});   /* o = place on the saved tab, for re-pointing entries */
  var delArmed=false,open=-1;
  var body=
    '<div class="field"><label for="t-name">Name</label><input id="t-name" class="input" placeholder="Bali" maxlength="40" autocomplete="off"><p class="error-msg" id="t-name-err" hidden></p></div>'+
    '<div class="g2"><div class="field"><label for="t-start">Starts</label><input id="t-start" type="date" class="input"></div><div class="field"><label for="t-end">Ends</label><input id="t-end" type="date" class="input"></div></div>'+
    '<p class="error-msg" id="t-date-err" hidden></p>'+
    '<fieldset class="fs"><legend class="flabel">People <span class="mono" id="t-pcount"></span></legend>'+
      '<div id="t-people"></div>'+
      '<button type="button" class="btn btn-ghost t-addp" id="t-addp">'+icon('plus')+'Add person</button>'+
      '<p class="error-msg" id="t-p-err" hidden></p>'+
    '</fieldset>'+
    '<fieldset class="fs"><legend class="flabel">Currencies</legend>'+
      '<div class="cur-row"><span>HK$ <span class="caption">Hong Kong dollar</span></span><span class="fixed">Totals are in HK$</span></div>'+
      '<div class="cur-row"><label class="check"><input type="checkbox" id="t-c-USD">US$</label><span class="rate">US$1 = HK$<input id="t-r-USD" class="input" inputmode="decimal" aria-label="HK dollars per US dollar"></span></div>'+
      '<div class="cur-row"><label class="check"><input type="checkbox" id="t-c-IDR">Rp</label><span class="rate">HK$1 = Rp<input id="t-r-IDR" class="input" inputmode="decimal" aria-label="Rupiah per HK dollar"></span></div>'+
      '<p class="caption" style="margin:0">Mid-market rates on '+RATES_ASOF+'. A new rate applies to entries added after the change.</p>'+
      '<p class="error-msg" id="t-r-err" hidden></p>'+
      '<div class="field"><span class="flabel">New entries start in</span><div class="segmented big" role="group" aria-label="Default currency" id="t-def"></div></div>'+
    '</fieldset>'+
    (isEdit?'<div class="switch-row"><span class="t"><span>Settled</span><small>Locks the tab once you have squared up.</small></span><label class="switch"><input type="checkbox" id="t-settled" aria-label="Settled"><span class="slider"></span></label></div>':'')+
    (isEdit?'<div class="sheet-actions"><button class="btn btn-ghost danger" id="t-del">'+icon('trash')+'Delete tab</button></div>':'');
  var foot='<button class="btn btn-primary" id="t-save">'+(isEdit?'Save tab':'Start tab')+'</button>';

  openSheet(isEdit?'Tab settings':'New tab',body,function(sh){
    $('#t-name',sh).value=d.name;$('#t-start',sh).value=d.start||'';$('#t-end',sh).value=d.end||'';
    ['USD','IDR'].forEach(function(k){$('#t-c-'+k,sh).checked=d.currencies.indexOf(k)>=0;$('#t-r-'+k,sh).value=String(d.rates[k]||DEFAULT_RATES[k])});
    if(isEdit)$('#t-settled',sh).checked=!!d.settled;
    function err(id,m){var el=$(id,sh);el.hidden=!m;el.textContent=m||'';return !m}
    function enabled(){return CUR_ORDER.filter(function(k){return k==='HKD'||$('#t-c-'+k,sh).checked})}
    function readNames(){d.people.forEach(function(p,i){var el=$('#t-p'+i,sh);if(el)p.name=el.value})}
    function cname(c){var s=SWATCHES.filter(function(x){return x[0]===c})[0];return s?s[1]:'Custom'}
    function drawPeople(focus){
      var n=d.people.length;
      $('#t-people',sh).innerHTML=d.people.map(function(p,i){
        var row='<div class="pe"><button type="button" class="pe-c" data-i="'+i+'" aria-expanded="'+(open===i)+'" aria-label="Colour for person '+(i+1)+': '+cname(p.colour)+'. Change" style="background:'+esc(p.colour)+'"></button>'+
          '<input id="t-p'+i+'" class="input" maxlength="20" autocomplete="off" placeholder="Name" aria-label="Person '+(i+1)+' name">'+
          (n>2?'<button type="button" class="icon-btn pe-x" data-i="'+i+'" aria-label="Remove person '+(i+1)+'">'+icon('x')+'</button>':'')+'</div>';
        if(open===i)row+='<div class="swatches pe-pal" role="radiogroup" aria-label="Colour for person '+(i+1)+'">'+SWATCHES.map(function(s){
          var taken=d.people.some(function(q,j){return j!==i&&q.colour===s[0]});
          return '<button type="button" class="swb" role="radio" data-i="'+i+'" data-c="'+s[0]+'" aria-checked="'+(p.colour===s[0])+'" aria-label="'+s[1]+(taken?', taken':'')+'"'+(taken?' disabled':'')+' style="background:'+s[0]+'"></button>'}).join('')+'</div>';
        return row;
      }).join('');
      d.people.forEach(function(p,i){$('#t-p'+i,sh).value=p.name});
      $('#t-pcount',sh).textContent=n+' of '+MAXP;
      $('#t-addp',sh).hidden=n>=MAXP;
      if(focus!=null){var el=$(focus,sh);if(el)el.focus()}
    }
    $('#t-people',sh).addEventListener('click',function(ev){
      var b=ev.target.closest('button');if(!b||b.disabled)return;var i=+b.dataset.i;
      readNames();
      if(b.classList.contains('pe-c')){open=open===i?-1:i;drawPeople(open>=0?'.swb[aria-checked="true"]':'.pe-c[data-i="'+i+'"]');return}
      if(b.classList.contains('swb')){d.people[i].colour=b.dataset.c;open=-1;drawPeople('.pe-c[data-i="'+i+'"]');return}
      if(b.classList.contains('pe-x')){
        var p=d.people[i],r=p.o!=null?entriesWith(t,p.o):0;
        if(r){err('#t-p-err',(p.name.trim()||'This person')+' is on '+r+(r===1?' entry':' entries')+'. Change or delete '+(r===1?'it':'them')+' first.');return}
        d.people.splice(i,1);open=-1;err('#t-p-err','');drawPeople();
      }
    });
    $('#t-addp',sh).addEventListener('click',function(){
      readNames();if(d.people.length>=MAXP)return;
      var c=AUTO_ORDER.map(function(k){return SWATCHES[k][0]}).filter(function(x){return !d.people.some(function(p){return p.colour===x})})[0]||SWATCHES[0][0];
      d.people.push({name:'',colour:c,o:null});open=-1;err('#t-p-err','');drawPeople('#t-p'+(d.people.length-1));
    });
    function upd(){
      ['USD','IDR'].forEach(function(k){$('#t-r-'+k,sh).disabled=!$('#t-c-'+k,sh).checked});
      var en=enabled();if(en.indexOf(d.defCur)<0)d.defCur='HKD';
      var seg=$('#t-def',sh);seg.innerHTML=en.map(function(k){return '<button data-c="'+k+'" class="'+(k===d.defCur?'active':'')+'">'+CUR[k].sym+'</button>'}).join('');
      $$('button',seg).forEach(function(b){b.addEventListener('click',function(){d.defCur=b.dataset.c;upd()})});
    }
    ['USD','IDR'].forEach(function(k){$('#t-c-'+k,sh).addEventListener('change',upd)});
    $('#t-save',sh).addEventListener('click',function(){
      readNames();
      var name=$('#t-name',sh).value.trim();var ok=err('#t-name-err',name?'':'Name the tab, for example Bali.');
      var st=$('#t-start',sh).value,en=$('#t-end',sh).value;ok=err('#t-date-err',st&&en&&en<st?'The end date is before the start date.':'')&&ok;
      var names=d.people.map(function(p){return p.name.trim()}),dup='';
      names.forEach(function(x,i){names.forEach(function(y,j){if(j>i&&x&&x.toLowerCase()===y.toLowerCase())dup=x})});
      ok=err('#t-p-err',names.some(function(x){return !x})?(d.people.length===2?'Give both people a name.':'Give everyone a name.'):dup?'Two people are called '+dup+'. Use different names.':'')&&ok;
      var rates={};var rerr='';
      ['USD','IDR'].forEach(function(k){var v=parseFloat(String($('#t-r-'+k,sh).value).replace(/,/g,''));if($('#t-c-'+k,sh).checked&&!(v>0))rerr='Enter a rate above zero for '+CUR[k].sym+'.';rates[k]=v>0?v:(d.rates[k]||DEFAULT_RATES[k])});
      ok=err('#t-r-err',rerr)&&ok;
      if(!ok)return;
      var now=Date.now();
      var rec={id:isEdit?t.id:uid(),name:name,start:st||'',end:en||'',people:d.people.map(function(p,i){return {name:names[i],colour:p.colour}}),currencies:enabled(),rates:rates,defCur:d.defCur,settled:isEdit?$('#t-settled',sh).checked:false,createdAt:isEdit?t.createdAt:now,updatedAt:now};
      /* someone removed from the middle: point every entry at the people's new places */
      if(isEdit&&d.people.some(function(p,i){return p.o!==i&&p.o!=null})){
        var map={};d.people.forEach(function(p,i){if(p.o!=null)map[p.o]=i});
        var moved=[],lost=false;
        tabEntries(t).forEach(function(e){
          var x=clone(e);function m(i){if(map[i]==null)lost=true;return map[i]}
          x.payer=m(e.payer);
          if(e.kind==='payment')x.to=m(payTo(e));
          else if(e.split){x.split.who=splitWho(e).map(m)}
          moved.push(x);
        });
        if(lost){err('#t-p-err','Someone you removed is still on an entry. Close this and try again.');return}
        moved.forEach(function(x){S.entries[x.id]=x;enqueue('entries',x.id,x)});
        var Lp=last(t);if(Lp.payer!=null)setLast(t,{cur:Lp.cur,payer:map[Lp.payer]!=null?map[Lp.payer]:0});
      }
      S.cur=rec.id;put('tabs',rec.id,rec);closeSheet();toast(isEdit?'Tab saved':'Tab started');
    });
    if(isEdit)$('#t-del',sh).addEventListener('click',function(ev){
      var b=ev.currentTarget;
      if(!delArmed){delArmed=true;b.innerHTML=icon('trash')+'Tap again to delete '+esc(t.name)+' and its '+tabEntries(t).length+' entries';setTimeout(function(){if(b.isConnected){delArmed=false;b.innerHTML=icon('trash')+'Delete tab'}},4000);return}
      tabEntries(t).forEach(function(x){delete S.entries[x.id];enqueue('entries',x.id,null)});
      S.cur=null;put('tabs',t.id,null);closeSheet();toast('Tab deleted');
    });
    drawPeople();upd();
    if(!isEdit)$('#t-name',sh).focus();
  },foot);
}

/* ── tab list sheet ────────────────────────────────────── */
function tabsSheet(){
  var l=tabList();
  var body='<ul class="rows">'+l.map(function(t){
    var N=t.people.length,c=calc(tabEntries(t),N),tr=c.transfers;
    var line=t.settled?'Settled':!c.nExp&&!c.nPay?'No entries yet':!tr.length?'All square':tr.length===1?pname(t,tr[0].from)+' owes '+pname(t,tr[0].to)+' '+fmt(tr[0].amt,'HKD'):tr.length+' payments to settle';
    if(N>2)line=N+' people · '+line;
    var cur=t.id===S.cur;
    return '<li><button class="rowb" data-tab="'+esc(t.id)+'"'+(cur?' aria-current="true"':'')+'><span class="rb-m"><span class="rb-t">'+esc(t.name)+'</span><span class="rb-s">'+esc(line)+'</span></span><span class="rb-a"><span class="tl-meta mono">'+(t.start?dmy(t.start):'')+'</span>'+(cur?'<span class="tl-meta">Open</span>':'')+'</span></button></li>';
  }).join('')+'</ul>'+
  '';
  var foot='<button class="btn btn-ghost" id="tl-new">'+icon('plus')+'New tab</button>';
  openSheet('Tabs',body,function(sh){
    $$('[data-tab]',sh).forEach(function(b){b.addEventListener('click',function(){S.cur=b.dataset.tab;saveCache();closeSheet();render();window.scrollTo(0,0)})});
    $('#tl-new',sh).addEventListener('click',function(){tabSheet(null)});
  },foot);
}

/* ── menu + theme (EDB wiring) ─────────────────────────── */
function setTheme(m){var r=document.documentElement;if(m==='system')r.removeAttribute('data-theme');else r.setAttribute('data-theme',m);lsSet('eds-theme',m);$$('.segmented [data-mode]').forEach(function(b){b.classList.toggle('active',b.dataset.mode===m)})}
var savedTheme=lsGet('eds-theme')||'dark';
$$('.segmented [data-mode]').forEach(function(b){b.classList.toggle('active',b.dataset.mode===savedTheme);b.addEventListener('click',function(){setTheme(b.dataset.mode)})});
var gear=$('#gear'),menu=$('#menu');
function closeMenu(){if(!menu.hidden){menu.hidden=true;gear.setAttribute('aria-expanded','false')}}
gear.addEventListener('click',function(ev){ev.stopPropagation();menu.hidden=!menu.hidden;gear.setAttribute('aria-expanded',String(!menu.hidden))});
document.addEventListener('click',function(ev){if(!menu.hidden&&!menu.contains(ev.target))closeMenu()});
document.addEventListener('keydown',function(ev){if(ev.key==='Escape'){if(sheetOpen())closeSheet();else if(!menu.hidden){closeMenu();gear.focus()}}});
$('#m-edit').addEventListener('click',function(){closeMenu();tabSheet(currentTab())});
$('#m-tabs').addEventListener('click',function(){closeMenu();tabsSheet()});

/* ── wiring ────────────────────────────────────────────── */
document.body.classList.add('has-bottom-nav');
$('#start-btn').addEventListener('click',function(){tabSheet(null)});
$('#tab-btn').addEventListener('click',tabsSheet);
$('#add-btn').addEventListener('click',function(){entrySheet(null)});
$('#vtabs').addEventListener('click',function(ev){var b=ev.target.closest('button[data-v]');if(!b)return;S.view=b.dataset.v;lsSet('splitedb:view',S.view);render()});
$('#calview').addEventListener('click',function(ev){
  var c=ev.target.closest('.cal-cell[data-d]');if(c){S.calSel=c.dataset.d;render();return}
  var r=ev.target.closest('.crow');if(r){if(!r.disabled){var e=S.entries[r.dataset.id];if(e)entrySheet(e)}return}
  if(ev.target.closest('[data-share]'))shareSheet();
});
$('#daysview').addEventListener('click',function(ev){
  var r=ev.target.closest('.drow');if(r){S.calSel=r.dataset.d;S.view='cal';lsSet('splitedb:view','cal');render();var v=$('#vtabs');if(v&&v.scrollIntoView)v.scrollIntoView({block:'start',behavior:'smooth'});return}
  if(ev.target.closest('[data-share]'))shareSheet();
});
$('#settle').addEventListener('click',function(ev){var b=ev.target.closest('.srow');if(!b||b.disabled)return;entrySheet(null,{kind:'payment',payer:+b.dataset.from,to:+b.dataset.to,base:+b.dataset.amt})});
$('#ledger').addEventListener('click',function(ev){var b=ev.target.closest('.rowb');if(!b||b.disabled)return;var e=S.entries[b.dataset.id];if(e)entrySheet(e)});

/* ── back up / restore ─────────────────────────────────── */
var ID_OK=/^[A-Za-z0-9_\-.~:@+]{1,200}$/;
var DL=null;   /* claude.ai downloads capability, resolved ahead so a save starts inside the tap */
if(window.claude&&typeof window.claude.use==='function')window.claude.use('downloads').then(function(d){DL=d},function(){});
function backupJSON(){return JSON.stringify({app:'splitedb',format:1,exportedAt:new Date().toISOString(),tabs:Object.keys(S.tabs).map(function(k){return S.tabs[k]}),entries:Object.keys(S.entries).map(function(k){return S.entries[k]})})}
function backupName(){return 'splitedb-backup-'+todayISO().replace(/-/g,'')+'.json'}
function saveFile(json,name){var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([json],{type:'application/json'}));a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},1500);toast('Backup saved · '+name)}
function showBackupText(json){openSheet('Backup','<p class="pnote">Copy all of this text and keep it somewhere safe, such as Notes. Paste it into Restore from backup to bring the data back.</p><textarea id="b-text" class="textarea mono" rows="9" readonly aria-label="Backup text"></textarea>',function(sh){var ta=$('#b-text',sh);ta.value=json;ta.focus();ta.select()})}
function doBackup(){
  closeMenu();
  if(!Object.keys(S.tabs).length){toast('Nothing to back up yet.');return}
  var json=backupJSON(),name=backupName(),inClaude=!!window.claude;
  if(inClaude){
    if(DL){DL.save({filename:name,data:json}).then(function(){toast('Backup saved · '+name)},function(e){if(e&&e.code==='declined')return;showBackupText(json)});return}
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(json).then(function(){toast('Backup copied. Paste it into Notes to keep it.')},function(){showBackupText(json)})}
    else showBackupText(json);
    return;
  }
  try{
    var file=new File([json],name,{type:'application/json'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      navigator.share({files:[file],title:'Splitedb backup'}).catch(function(e){if(!e||e.name!=='AbortError')saveFile(json,name)});
      return;
    }
  }catch(e){}
  saveFile(json,name);
}
function restoreSheet(){
  closeMenu();
  var body='<p class="pnote">Restoring adds the tabs and entries in a backup. Anything with the same ID is replaced by the backup copy; nothing else is deleted.</p>'+
    '<div class="field"><label for="r-file">Backup file</label><input id="r-file" type="file" accept=".json,application/json,text/plain" class="input"></div>'+
    '<div class="field"><label for="r-text">Or paste the backup text</label><textarea id="r-text" class="textarea mono" rows="6" autocomplete="off" spellcheck="false"></textarea></div>'+
    '<p class="error-msg" id="r-err" hidden></p>';
  openSheet('Restore from backup',body,function(sh){
    var fileText=null;
    function err(m){var el=$('#r-err',sh);el.hidden=!m;el.textContent=m||''}
    $('#r-file',sh).addEventListener('change',function(ev){var f=ev.target.files&&ev.target.files[0];if(!f)return;var rd=new FileReader();rd.onload=function(){fileText=String(rd.result);err('')};rd.onerror=function(){err('That file could not be read. Try pasting the text instead.')};rd.readAsText(f)});
    $('#r-text',sh).addEventListener('input',function(){fileText=null;err('')});
    $('#r-go',sh).addEventListener('click',function(){
      var txt=fileText||$('#r-text',sh).value.trim();
      if(!txt){err('Choose a backup file or paste the backup text.');return}
      var o;try{o=JSON.parse(txt)}catch(e){err('That is not a complete Splitedb backup. Check the whole text was copied.');return}
      if(!o||o.app!=='splitedb'||!Array.isArray(o.tabs)||!Array.isArray(o.entries)){err('That is not a Splitedb backup.');return}
      var nt=0,ne=0;
      o.tabs.forEach(function(t){if(t&&ID_OK.test(t.id||'')&&t.people&&t.people.length>=2&&t.people.length<=MAXP&&t.name){S.tabs[t.id]=t;enqueue('tabs',t.id,t);nt++}});
      o.entries.forEach(function(e){if(e&&ID_OK.test(e.id||'')&&e.tabId&&typeof e.base==='number'&&typeof e.amount==='number'&&CUR[e.cur]){S.entries[e.id]=e;enqueue('entries',e.id,e);ne++}});
      if(!nt&&!ne){err('That backup has no tabs or entries in it.');return}
      S.ready=true;saveCache();closeSheet();render();
      toast('Restored '+nt+' tab'+(nt===1?'':'s')+' and '+ne+(ne===1?' entry':' entries'));
    });
  },'<button class="btn btn-primary" id="r-go">Restore</button>');
}
$('#m-backup').addEventListener('click',doBackup);
$('#m-restore').addEventListener('click',restoreSheet);

/* ── hosted build: offline cache + ask the browser to keep storage ── */
if(!window.claude&&/^(https:|http:)$/.test(location.protocol)&&(location.protocol==='https:'||/^(localhost|127\.0\.0\.1)$/.test(location.hostname))){
  if('serviceWorker' in navigator)window.addEventListener('load',function(){navigator.serviceWorker.register('./sw.js').catch(function(){})});
  if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(function(){});
}

window.SplitedbEngine={parseAmount:parseAmount,toBase:toBase,fromBase:fromBase,splitPct:splitPct,splitExact:splitExact,splitEq:splitEq,shares:shares,settle:settle,calc:calc,fmt:fmt};
render();
initDb();
})();
</script>
