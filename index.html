/* ── SPLITEDB ──────────────────────────────────────────────
   Layout: one centred phone column (max 520px). Hero = tab name,
   then the two-ring "who paid / whose share" chart, person tiles (a list for 3+),
   and a day-grouped ledger. Add bar fixed to the bottom edge.
   Person colours --p0 … --p9 are set per tab (EDB categorical six + four for groups). */
:root{--p0:#0ea5e9;--p1:#f5a524;--p0-on:#050a0e;--p1-on:#050a0e}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:110;background:var(--bg)}
body.sheet-open{overflow:hidden}
[hidden]{display:none!important}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.wrap{max-width:520px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(104px + env(safe-area-inset-bottom,0px))}
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:100;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px}
.brand{color:var(--muted-text)}
.hdr-r{display:flex;align-items:center;gap:10px}
.sync{font-size:12px;color:var(--muted-text)}
.menu .sync-line{font-size:12px;color:var(--muted-text);padding:var(--space-1) var(--space-3) var(--space-2);line-height:1.35}

.hero{padding-block:12px 4px;display:flex;flex-direction:column;gap:6px}
.tab-btn{background:none;border:0;padding:0;margin:0;color:var(--text);font:inherit;display:inline-flex;align-items:center;gap:10px;cursor:pointer;border-radius:var(--radius-md);text-align:left;max-width:100%}
.tab-btn:focus-visible{outline:none;box-shadow:var(--focus-ring)}
.tab-btn .tn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;text-wrap:balance}
.tab-btn .icon{color:var(--muted-text)}
.meta{color:var(--muted-text);font-size:13px;display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center;margin:0}
.settled-note{font-size:13px;color:var(--muted-text);margin:8px 0 0}

.ring-box{position:relative;width:min(300px,78vw);aspect-ratio:1;margin:20px auto 8px;max-width:100%}
.ring-box svg{width:100%;height:100%;display:block}
.trk{fill:none;stroke:var(--border)}
.seg{fill:none;transition:stroke-dasharray var(--duration-hero) var(--ease-standard),stroke-dashoffset var(--duration-hero) var(--ease-standard)}
.ring-c{position:absolute;inset:23%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:4px}
.rc-l{font-size:13px;color:var(--muted-text);line-height:1.3}
.rc-n{font-family:var(--font-mono);font-weight:500;font-size:30px;letter-spacing:-0.02em;line-height:1.1;font-variant-numeric:tabular-nums;white-space:nowrap}
.rc-n.zero{color:var(--muted-text)}
.rc-s{font-family:var(--font-mono);font-size:12px;color:var(--muted-text);font-variant-numeric:tabular-nums}
.ring-key{display:flex;justify-content:center;gap:16px;flex-wrap:wrap;margin:0 0 20px;font-size:12px;color:var(--muted-text)}
.ring-key span{display:inline-flex;align-items:center;gap:6px}
.ring-key i{display:inline-block;width:14px;border-radius:var(--radius-sm);background:var(--muted)}
.ring-key i.k-o{height:8px}.ring-key i.k-i{height:3px}

.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.ptile{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.ptile-h{display:flex;align-items:center;gap:8px;min-width:0;margin-bottom:2px}
.ptile-h h4{font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sw{width:12px;height:12px;border-radius:var(--radius-sm);flex:none}
.kv{display:flex;justify-content:space-between;align-items:baseline;gap:6px;font-size:12px;color:var(--muted-text)}
.kv .mono{color:var(--text);font-size:13px;white-space:nowrap}
.b2{height:6px;background:var(--surface-high);border-radius:var(--radius-sm);overflow:hidden;margin-bottom:4px}
.b2 span{display:block;height:100%;width:0;border-radius:var(--radius-sm);transition:width var(--duration-slow) var(--ease-standard)}
.b2.sh span{background:var(--muted)}
.net{border-top:1px solid var(--border);margin-top:2px;padding-top:8px;font-size:12px;color:var(--muted-text);display:flex;flex-direction:column;gap:2px}
.net .mono{font-size:16px;color:var(--text);font-weight:500;white-space:nowrap}
.total-line{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted-text);margin:12px 4px 0}
.total-line .mono{color:var(--text)}

.led-h{display:flex;align-items:baseline;justify-content:space-between;margin:32px 0 4px}
.led-h h2{font-size:20px;font-weight:500}
.day{margin-top:14px}
.day-h{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted-text);padding:0 4px 6px}
.rows{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden}
.rows li+li{border-top:1px solid var(--border)}
.rowb{width:100%;display:flex;align-items:center;gap:12px;padding:10px 12px;background:none;border:0;color:var(--text);font:inherit;text-align:left;cursor:pointer;min-height:58px}
.rowb:hover{background:var(--surface-high)}
.rowb:focus-visible{outline:none;box-shadow:inset 0 0 0 2px var(--accent)}
.rowb:disabled{cursor:default}
.rowb:disabled:hover{background:none}
.av{width:34px;height:34px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;flex:none}
.av.pay{background:var(--surface-high);color:var(--muted-text);border:1px solid var(--border)}
.rb-m{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.rb-t{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rb-s{font-size:12px;color:var(--muted-text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rb-a{display:flex;flex-direction:column;align-items:flex-end;gap:2px;flex:none}
.rb-a .a1{font-size:14px}
.rb-a .a2{font-size:12px;color:var(--muted-text)}
.led-empty{background:var(--surface);border:1px dashed var(--border);border-radius:var(--radius-lg);padding:20px 16px;text-align:center;color:var(--muted-text);font-size:14px;margin-top:12px}

.addbar{position:fixed;left:0;right:0;bottom:0;z-index:var(--z-sticky);background:var(--bg);border-top:1px solid var(--border);padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.addbar .btn{width:100%;max-width:488px;margin:0 auto;display:flex;justify-content:center;min-height:50px;font-size:16px}

.scrim{z-index:var(--z-scrim)}
.sheet{position:fixed;left:0;right:0;bottom:var(--kb,0px);z-index:var(--z-modal);margin:0 auto;max-width:560px;background:var(--surface);border:1px solid var(--border);border-bottom:0;border-radius:var(--radius-lg) var(--radius-lg) 0 0;box-shadow:var(--shadow-overlay);max-height:calc(var(--vvh,100dvh) - 24px);overflow-y:auto;overscroll-behavior:contain;padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));animation:sheet-in var(--duration-slow) var(--ease-enter) both}
.sheet-b{padding-bottom:16px}
.sheet-foot{position:sticky;bottom:0;z-index:2;background:var(--surface);border-top:1px solid var(--border);padding:10px 0 calc(12px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px}
.sheet-foot .btn{width:100%;justify-content:center;min-height:48px;font-size:16px}
.kp{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.kp button{height:50px;border-radius:var(--radius-lg);background:var(--surface-high);border:1px solid var(--border);color:var(--text);font-family:var(--font-mono);font-size:22px;font-weight:500;touch-action:manipulation;cursor:pointer;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;display:flex;align-items:center;justify-content:center}
.kp button:active{background:var(--border)}
.kp button:focus-visible{outline:none;box-shadow:var(--focus-ring)}
.kp .k-fn{color:var(--muted-text)}
.amt-wrap.kp-on{border-bottom-color:var(--accent)}
.input.kp-on{border-color:var(--accent)}
.touch .amt,.touch .kp-field{caret-color:transparent;cursor:pointer}
.top-row{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px}
.top-row .segmented button{padding:6px 12px}
@keyframes sheet-in{from{transform:translateY(24px);opacity:0}}
.sheet-h{position:sticky;top:0;background:var(--surface);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 0 12px;z-index:2}
.sheet-h h3{font-size:20px}
.sheet-b{display:flex;flex-direction:column;gap:18px}
.flabel{font-size:12px;color:var(--muted-text)}
.fs{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;min-width:0}
.fs legend{padding:0;margin-bottom:10px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.g2 .input{min-width:0}

.amt-wrap{display:flex;align-items:baseline;gap:8px;border-bottom:1px solid var(--border);padding-bottom:4px}
.amt-wrap:focus-within{border-bottom-color:var(--accent)}
.amt-sym{font-family:var(--font-mono);font-size:22px;color:var(--muted-text);flex:none}
.amt{flex:1;min-width:0;width:100%;background:none;border:0;color:var(--text);font-family:var(--font-mono);font-size:40px;font-weight:500;padding:0;outline:none;font-variant-numeric:tabular-nums;border-radius:0}
.amt::placeholder{color:var(--muted)}
.conv{font-size:12px;color:var(--muted-text);margin:6px 0 0;font-family:var(--font-mono)}
.amt-row{display:flex;flex-direction:column;gap:10px}
.amt-row .segmented{align-self:flex-start}
.segmented.big button{font-size:14px;padding:6px 14px}

.pp{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.pbtn{display:flex;align-items:center;gap:10px;min-height:48px;padding:8px 12px;background:var(--surface-high);border:1px solid var(--border);border-radius:var(--radius-md);color:var(--text);font:inherit;font-size:15px;cursor:pointer;min-width:0}
.pbtn span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pbtn[aria-checked="true"]{border-color:var(--text);box-shadow:inset 0 0 0 1px var(--text)}
.pbtn:focus-visible{outline:none;box-shadow:var(--focus-ring)}
.pnote{font-size:13px;color:var(--muted-text);margin:2px 0 0}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:36px;padding:6px 12px;border-radius:var(--radius-full);border:1px solid var(--border);background:none;color:var(--muted-text);font:inherit;font-size:13px;cursor:pointer;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip[aria-pressed="true"]{color:var(--text);border-color:var(--text);background:var(--surface-high)}
.chip:focus-visible{outline:none;box-shadow:var(--focus-ring)}
.chip,.pbtn,.srow,.pe-c,.swb{-webkit-tap-highlight-color:transparent}
@media (pointer:coarse){.chip{min-height:44px}}

.sbar{position:relative;height:48px;touch-action:none;cursor:pointer;-webkit-user-select:none;user-select:none}
.sbar .st{position:absolute;left:0;right:0;top:15px;height:18px;border-radius:var(--radius-md);overflow:hidden;display:flex;gap:2px;background:var(--surface)}
.sbar .st span{display:block;height:100%}
.sbar .st .s0{background:var(--p0)}.sbar .st .s1{background:var(--p1);flex:1}
.sbar .hd{position:absolute;top:8px;width:8px;height:32px;margin-left:-4px;border-radius:var(--radius-md);background:var(--text);box-shadow:0 0 0 2px var(--surface);pointer-events:none}
.sbar input{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px;left:0;top:0}
.sbar:focus-within .st{box-shadow:var(--focus-ring)}
.sread{display:flex;justify-content:space-between;gap:8px;font-size:13px}
.sread>span{display:flex;flex-direction:column;gap:1px;min-width:0}
.sread>span:last-child{text-align:right}
.sread .nm{color:var(--muted-text);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.sheet-actions{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.sheet-actions .btn{width:100%;justify-content:center;min-height:48px;font-size:16px}
.btn-ghost.danger{color:var(--error-text)}
.error-msg{font-size:12px;color:var(--error-text);margin:4px 0 0}

.person-row{display:flex;flex-direction:column;gap:8px}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swb{width:34px;height:34px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0;box-shadow:inset 0 0 0 2px var(--surface)}
.swb[aria-checked="true"]{border-color:var(--text)}
.swb:disabled{opacity:.25;cursor:not-allowed}
.swb:focus-visible{outline:none;box-shadow:var(--focus-ring)}
@media (pointer:coarse){.swb{width:40px;height:40px}}
.cur-row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px;flex-wrap:wrap}
.cur-row .rate{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-mono);font-size:13px;color:var(--muted-text)}
.cur-row .rate .input{width:112px;font-family:var(--font-mono)}
.cur-row .fixed{font-size:12px;color:var(--muted-text)}
.switch-row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px}
.switch-row .t{display:flex;flex-direction:column;gap:2px}
.switch-row .t small{font-size:12px;color:var(--muted-text)}

.tl-meta{font-size:12px;color:var(--muted-text)}
.loading{display:flex;flex-direction:column;gap:16px;padding-top:24px}
.loading .sk-a{height:34px;width:55%}
.loading .sk-b{width:min(300px,78vw);aspect-ratio:1;border-radius:50%;margin:8px auto}
.loading .sk-c{height:88px}
.toast{max-width:calc(100% - 32px)}
.toast .toast-act{background:none;border:0;color:var(--accent-text);font:inherit;font-weight:600;cursor:pointer;padding:4px 2px;min-height:32px}
.has-bottom-nav .toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}

/* ── v0.3 · one-screen add panel, no sideways pan, blinking caret ── */
html,body{overflow-x:hidden;overscroll-behavior-x:none}
@supports (overflow:clip){html,body{overflow-x:clip}}
html{touch-action:manipulation;-webkit-text-size-adjust:100%}
.sheet{overflow-x:hidden;touch-action:pan-y;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
.sheet *{min-width:0}
.sheet-h{padding:12px 0 8px}
.sheet-h h3{font-size:18px}
.sheet-b{gap:12px;padding-bottom:12px}
.top-row .segmented button{padding:5px 10px;font-size:13px}
.amt-wrap{padding-bottom:2px}
.amt{font-size:34px}
.amt-sym{font-size:18px}
.conv{margin-top:4px}
.amt-disp{display:flex;align-items:center;flex:1;min-height:46px;cursor:pointer;white-space:nowrap;overflow:hidden;font-family:var(--font-mono);font-weight:500;font-size:34px;font-variant-numeric:tabular-nums;color:var(--text);outline:none}
.amt-disp:focus-visible{box-shadow:var(--focus-ring);border-radius:var(--radius-sm)}
.amt-disp .ph{color:var(--muted)}
.amt-disp .caret{display:inline-block;flex:none;width:2px;height:34px;margin:0 1px;background:var(--accent-text);visibility:hidden}
.amt-wrap.kp-on .caret{visibility:visible;animation:sdb-caret 1.06s steps(1) infinite}
@keyframes sdb-caret{50%{visibility:hidden}}
@media (prefers-reduced-motion:reduce){.amt-wrap.kp-on .caret{animation:none}}
.row2{display:grid;grid-template-columns:minmax(0,1fr) 144px;gap:10px}
input[type="date"].input{min-width:0;max-width:100%;width:100%;-webkit-appearance:none;appearance:none;display:block;text-align:left}
input[type="date"]::-webkit-date-and-time-value{text-align:left}
.irow{display:flex;align-items:center;gap:10px}
.irow>.flabel{flex:0 0 52px}
.irow .pp,.irow .chips{flex:1}
.pp{gap:8px}
.pbtn{min-height:44px;padding:6px 10px;font-size:14px;gap:8px}
.chips{gap:6px}
.chip{padding:4px 10px;font-size:13px}
.pnote{margin:-6px 0 0 62px}
.split-block{display:flex;flex-direction:column;gap:4px}
.sbar{height:36px}
.sbar .st{top:10px;height:16px}
.sbar .hd{top:4px;height:28px}
.sread{font-size:12px}
.sread>span{flex-direction:row;gap:6px;align-items:baseline}
.sheet-foot{padding:8px 0 calc(10px + env(safe-area-inset-bottom,0px));gap:8px}
.kp{gap:6px}
.kp button{height:46px;font-size:21px;-webkit-touch-callout:none}
.sheet-foot .btn{min-height:46px}
.ring-box{width:min(260px,66vw);margin:12px auto 6px}
.rc-n{font-size:26px}
.hero{padding-block:8px 0}
.tiles{gap:10px}
.ptile{padding:10px}
.led-h{margin-top:24px}

/* ── v0.4 · calendar and days views ── */
.vtabs{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:24px 0 6px}
.vtabs .segmented button{padding:6px 12px;font-size:13px}
@media (pointer:coarse){.vtabs .segmented button{min-height:40px}}
.cal-wd{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;font-size:11px;color:var(--muted-text);text-align:center;margin:6px 0 4px}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.cal-cell{height:66px;box-sizing:border-box;padding:4px;border-radius:var(--radius-lg);display:flex;flex-direction:column;justify-content:space-between;align-items:stretch;text-align:left;background:var(--surface);border:1px solid var(--border);color:var(--text);font:inherit;cursor:pointer;min-width:0;overflow:hidden}
.cal-cell .dn{font-family:var(--font-mono);font-size:11px;white-space:nowrap}
.cal-cell .mbs{display:flex;flex-direction:column;gap:2px;min-width:0}
.cal-cell .mb{display:block;height:5px;border-radius:2px;max-width:100%}
.cal-cell .more{font-family:var(--font-mono);font-size:11px;color:var(--muted-text);line-height:1}
.cal-cell.off{background:transparent;border-color:transparent;cursor:default}
.cal-cell.off .dn{color:var(--muted)}
.cal-cell[aria-pressed="true"]{border-color:var(--accent-text);box-shadow:inset 0 0 0 1px var(--accent-text);background:var(--surface-high)}
.cal-cell:focus-visible{outline:none;box-shadow:var(--focus-ring)}
.cal-det-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:16px 2px 6px;font-size:15px;font-weight:600}
.crow{width:100%;display:flex;flex-direction:column;gap:5px;padding:10px 12px;background:none;border:0;color:var(--text);font:inherit;text-align:left;cursor:pointer;min-width:0}
.crow:hover{background:var(--surface-high)}
.crow:disabled{cursor:default}
.crow .top{display:flex;justify-content:space-between;gap:8px;font-size:14px;min-width:0}
.crow .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.crow .bar{display:block;height:10px;border-radius:3px}
.crow .sub{font-size:12px;color:var(--muted-text)}
.drow{width:100%;display:grid;grid-template-columns:74px minmax(0,1fr) 82px;align-items:center;gap:10px;min-height:50px;padding:0 12px;background:none;border:0;color:var(--text);font:inherit;text-align:left;cursor:pointer}
.drow:hover{background:var(--surface-high)}
.drow .dl{display:flex;flex-direction:column;line-height:1.2}
.drow .wd{font-size:12px;color:var(--muted-text)}
.drow .dl .mono{font-size:12px}
.drow .dbar{display:block;height:12px;background:var(--surface-high);border-radius:3px;overflow:hidden}
.drow .dbar>span{display:flex;gap:1px;height:100%}
.drow .dbar i{display:block;height:100%}
.drow .amt{font-size:13px;text-align:right}
.vkey{display:flex;flex-wrap:wrap;gap:6px 16px;margin:10px 2px 0;font-size:12px;color:var(--muted-text)}
.vkey>span{display:inline-flex;align-items:center;gap:6px}
.vkey .sw{width:10px;height:10px}
.share-btn{width:100%;justify-content:center;margin-top:12px;min-height:46px}
.share-prev img{display:block;width:100%;height:auto;border-radius:var(--radius-lg);border:1px solid var(--border)}
.share-prev{max-height:58vh;overflow:auto;border-radius:var(--radius-lg)}

/* ── v0.5 · groups of 2 to 10 ── */
.tiles.as-list{display:block}
.plist{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden}
.plist li{display:grid;grid-template-columns:12px minmax(0,1fr) auto;column-gap:10px;row-gap:6px;align-items:center;padding:9px 12px}
.plist li+li{border-top:1px solid var(--border)}
.pl-m{display:flex;flex-direction:column;gap:1px;min-width:0}
.pl-n{font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl-s{font-size:12px;color:var(--muted-text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl-s .mono{color:var(--text)}
.pl-r{display:flex;flex-direction:column;align-items:flex-end;gap:1px}
.pl-r .lab{font-size:11px;color:var(--muted-text)}
.pl-r .mono{font-size:14px;font-weight:500;white-space:nowrap}
.pl-r .mono.zero{color:var(--muted-text);font-weight:400}
.pl-bars{grid-column:2 / 4;display:flex;flex-direction:column;gap:2px}
.pl-bars .b2{height:4px;margin:0}
.pl-key{margin-top:6px}
.rc-s.txt{font-family:var(--font-ui);font-size:12px}
.settle{margin-top:18px}
.settle-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:0 2px 6px;font-size:15px;font-weight:600}
.srow{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;min-height:50px;background:none;border:0;color:var(--text);font:inherit;font-size:14px;text-align:left;cursor:pointer}
.srow:hover{background:var(--surface-high)}
.srow:focus-visible{outline:none;box-shadow:inset 0 0 0 2px var(--accent)}
.srow:disabled{cursor:default}.srow:disabled:hover{background:none}
.srow .who{display:flex;align-items:center;gap:6px;min-width:0;overflow:hidden;white-space:nowrap}
.srow .who .nm{overflow:hidden;text-overflow:ellipsis;min-width:0}
.srow .who .icon{color:var(--muted-text);flex:none;margin:0 2px}
.srow>.mono{flex:none}
.settle .pnote{margin:6px 2px 0}
/* add panel with a group: names wrap as chips, label sits on the first line */
.irow.multi{align-items:flex-start}
.irow.multi>.flabel{line-height:40px}
.pp.many{display:flex;flex-wrap:wrap;gap:6px}
.pp.many .pbtn{min-height:40px;padding:4px 10px;font-size:13px;gap:6px;flex:0 1 auto;max-width:100%}
.pp.many .pbtn .sw{width:10px;height:10px}
.pbtn:disabled{opacity:.35;cursor:default}
.chip.pt{display:inline-flex;align-items:center;gap:6px}
.chip.pt .sw{width:10px;height:10px}
.chip.pt span:last-child{overflow:hidden;text-overflow:ellipsis}
.chip.pt[aria-pressed="false"] .sw{opacity:.3}
.chip.pt[aria-pressed="false"] span:last-child{text-decoration:line-through;text-decoration-color:var(--muted)}
@media (pointer:coarse){.chip.pt,#f-all{min-height:40px}}
.eqr{font-size:12px;color:var(--muted-text);margin:0 0 0 62px;font-family:var(--font-mono)}
/* tab settings: one line per person, colour dot opens the palette */
#t-people{display:flex;flex-direction:column;gap:8px}
.pe{display:flex;align-items:center;gap:8px}
.pe .input{flex:1;min-width:0}
.pe-c{width:40px;height:40px;border-radius:50%;flex:none;cursor:pointer;padding:0;border:3px solid var(--surface);box-shadow:0 0 0 1px var(--border)}
.pe-c[aria-expanded="true"]{box-shadow:0 0 0 2px var(--text)}
.pe-c:focus-visible{outline:none;box-shadow:var(--focus-ring);}
.pe-x{flex:none}
.pe-pal{padding:2px 0 6px 48px}
.t-addp{align-self:flex-start}

/* hosted: keep content clear of the status bar (claude.ai's frame does this for the artifact) */
:root{padding-top:env(safe-area-inset-top,0px)}
</style>

<script>
(function(){
'use strict';

/* ── constants ─────────────────────────────────────────── */
var CUR = {
  HKD:{sym:'HK$', dp:2, name:'Hong Kong dollar'},
  USD:{sym:'US$', dp:2, name:'US dollar'},
  IDR:{sym:'Rp',  dp:0, name:'Indonesian rupiah'}
};
var CUR_ORDER = ['HKD','USD','IDR'];
var DEFAULT_RATES = {USD:7.8466, IDR:2300};   /* USD: HK$ per US$1 · IDR: Rp per HK$1 */
var RATES_ASOF = '29/10/2026';
/* People colours: EDB's six categorical hues, then four added for groups (v0.5), picked by search for the
   largest normal-vision gap to every other colour (all new pairs ΔE ≥ 15). Ten hues cannot all be told apart
   with colour-blindness, so a name is always written next to a colour. */
var SWATCHES = [['#0ea5e9','Sky'],['#3fae82','Green'],['#6366f1','Indigo'],['#f5a524','Amber'],['#a11d33','Garnet'],['#8a9a8e','Sage'],['#e765cd','Orchid'],['#f0503d','Coral'],['#a644a0','Plum'],['#636906','Olive']];
var AUTO_ORDER = [0,3,2,1,6,7,4,8,5,9];   /* the colour a new person gets: the next unused one, most distinct first */
var MAXP = 10;
var LS = 'splitedb:v1';
/* Touch screens get the in-app number pad; a mouse and keyboard type straight into the field. */
var TOUCH = !!(window.matchMedia && window.matchMedia('(pointer: coarse)').matches);
var NUMATTR = TOUCH ? 'inputmode="none" readonly' : 'inputmode="decimal"';
/* 1234567.5 -> 1,234,567.5 while typing; parseAmount strips the commas again */
function group(raw){raw=String(raw==null?'':raw).replace(/,/g,'');if(!raw)return '';var p=raw.split('.');var i=p[0]?Number(p[0]).toLocaleString('en-GB'):'0';return p.length>1?i+'.'+p[1]:i}

/* ── helpers ───────────────────────────────────────────── */
function $(s,el){return (el||document).querySelector(s)}
function $$(s,el){return Array.prototype.slice.call((el||document).querySelectorAll(s))}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function icon(n,c){return '<svg class="icon'+(c?' '+c:'')+'" aria-hidden="true"><use href="#ph-'+n+'"/></svg>'}
function clone(o){return JSON.parse(JSON.stringify(o))}
function todayISO(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function dmy(iso){if(!iso)return '';var p=iso.split('-');return p[2]+'/'+p[1]+'/'+p[0]}
function dayName(iso){var p=iso.split('-');return new Date(+p[0],+p[1]-1,+p[2]).toLocaleDateString('en-GB',{weekday:'short'})}
function daysBetween(a,b){var pa=a.split('-'),pb=b.split('-');return Math.round((Date.UTC(+pb[0],+pb[1]-1,+pb[2])-Date.UTC(+pa[0],+pa[1]-1,+pa[2]))/864e5)}
function lum(hex){var n=parseInt(hex.slice(1),16);var c=[n>>16&255,n>>8&255,n&255].map(function(v){v/=255;return v<=0.03928?v/12.92:Math.pow((v+0.055)/1.055,2.4)});return 0.2126*c[0]+0.7152*c[1]+0.0722*c[2]}
function onColour(hex){var L=lum(hex),dark=lum('#050a0e');return (L+0.05)/(dark+0.05)>=1.05/(L+0.05)?'#050a0e':'#ffffff'}

/* ── money engine: integer minor units, HK$ is the tab currency ── */
function p10(dp){return dp===2?100:dp===0?1:Math.pow(10,dp)}
function fmt(minor,code,o){
  o=o||{};var c=CUR[code];var neg=minor<0;var a=Math.abs(Math.round(minor));var p=p10(c.dp);
  var s=Math.floor(a/p).toLocaleString('en-GB');
  if(c.dp&&!o.short)s+='.'+String(a%p).padStart(c.dp,'0');
  return (neg?'−':'')+c.sym+s;
}
function inputStr(minor,code){var c=CUR[code];var p=p10(c.dp);var w=Math.floor(minor/p);return c.dp?w+'.'+String(minor%p).padStart(c.dp,'0'):String(w)}
/* Accepts 450000, 450,000, 450.000 (rupiah), 450k, 1.2m, 1,2jt is not supported. */
function parseAmount(raw,code,allowZero){
  var dp=CUR[code].dp;var s=String(raw==null?'':raw).trim().toLowerCase().replace(/[\s,]/g,'');
  if(!s)return {err:'Enter an amount'};
  var mult=1;var m=s.match(/^(.*?)(k|m|jt)$/);
  if(m){s=m[1];mult=m[2]==='k'?1e3:1e6}
  else if(dp===0&&/^\d{1,3}(\.\d{3})+$/.test(s)){s=s.replace(/\./g,'')}
  if(!/^\d*\.?\d*$/.test(s)||s===''||s==='.')return {err:'Enter a number, like 450000 or 450k'};
  var minor=Math.round(parseFloat(s)*mult*p10(dp));
  if(!isFinite(minor))return {err:'Enter a number, like 450000 or 450k'};
  if(minor<0||(!allowZero&&minor===0))return {err:'Enter an amount above zero'};
  if(minor>1e13)return {err:'That amount is too large'};
  return {minor:minor};
}
function toBase(minor,code,rate){
  if(code==='HKD')return minor;
  if(code==='USD')return Math.round(minor*rate);        /* US cents × HK$/US$ = HK cents */
  if(code==='IDR')return Math.round(minor*100/rate);    /* Rp ÷ (Rp per HK$) × 100 = HK cents */
  return minor;
}
function fromBase(hk,code,rate){
  if(code==='HKD')return hk;
  if(code==='USD')return Math.round(hk/rate);
  if(code==='IDR')return Math.round(hk*rate/100);
  return hk;
}
/* Percentage split, integer-exact. The odd unit goes to the larger remainder; ties go to person 0. */
function splitPct(total,a){
  a=Math.max(0,Math.min(100,Math.round(a)));
  if(a===100)return [total,0];if(a===0)return [0,total];
  var n0=total*a,n1=total*(100-a);var s0=Math.floor(n0/100),s1=Math.floor(n1/100);var left=total-s0-s1;
  if(left>0){if(n1%100>n0%100)s1+=left;else s0+=left}
  return [s0,s1];
}
function splitExact(total,amount,a0){if(!amount)return [0,total];var s0=Math.round(total*a0/amount);s0=Math.max(0,Math.min(total,s0));return [s0,total-s0]}
/* Equal split among the people in who (v0.5), integer-exact: leftover units go one each to the first people listed. */
function splitEq(total,who,n){var r=zeros(n);var k=who.length;if(!k)return r;var q=Math.floor(total/k),left=total-q*k;who.forEach(function(i,j){r[i]+=q+(j<left?1:0)});return r}
function zeros(n){var r=[];for(var i=0;i<n;i++)r.push(0);return r}
/* Split shapes: {mode:'eq',who:[…]} (v0.5) · {mode:'pct',a,who?:[i,j]} (two people; no who = people 0 and 1) · {mode:'exact',a} (v0.2, kept for old entries) */
function splitWho(e){var s=e.split;if(!s)return [];return s.who?s.who.slice():[0,1]}
/* who a payment went to; payments before v0.5 have no "to" and went to the other of two people */
function payTo(e){return e.to!=null?e.to:1-e.payer}
function needN(list){var m=1;list.forEach(function(e){m=Math.max(m,e.payer);if(e.kind==='payment')m=Math.max(m,payTo(e));else splitWho(e).forEach(function(i){m=Math.max(m,i)})});return m+1}
function shares(e,n){
  n=Math.max(n||0,needN([e]));var r=zeros(n);var s=e.split;if(!s)return r;
  if(s.mode==='eq')return splitEq(e.base,s.who,n);
  var w=s.who||[0,1];var p=s.mode==='exact'?splitExact(e.base,e.amount,s.a):splitPct(e.base,s.a);
  r[w[0]]+=p[0];r[w[1]]+=p[1];return r;
}
function calc(list,n){
  n=Math.max(n||2,needN(list));
  var r={n:n,paid:zeros(n),share:zeros(n),back:zeros(n),recv:zeros(n),net:zeros(n),total:0,nExp:0,nPay:0};
  list.forEach(function(e){
    if(e.kind==='payment'){r.back[e.payer]+=e.base;r.recv[payTo(e)]+=e.base;r.nPay++}
    else{r.paid[e.payer]+=e.base;var s=shares(e,n);for(var i=0;i<n;i++)r.share[i]+=s[i];r.total+=e.base;r.nExp++}
  });
  for(var i=0;i<n;i++)r.net[i]=r.paid[i]-r.share[i]+r.back[i]-r.recv[i];
  r.transfers=settle(r.net);
  return r;
}
/* Who pays whom to square up: whoever owes most pays whoever is owed most, until everyone is even.
   At most one payment fewer than the number of people. */
function settle(net){
  var cr=[],db=[];net.forEach(function(v,i){if(v>0)cr.push({i:i,v:v});else if(v<0)db.push({i:i,v:-v})});
  function by(a,b){return b.v-a.v||a.i-b.i}
  var out=[];
  while(cr.length&&db.length){cr.sort(by);db.sort(by);var c=cr[0],d=db[0],m=Math.min(c.v,d.v);out.push({from:d.i,to:c.i,amt:m});c.v-=m;d.v-=m;if(!c.v)cr.shift();if(!d.v)db.shift()}
  return out;
}
function rateFor(t,code){return code==='HKD'?null:(t.rates&&t.rates[code])||DEFAULT_RATES[code]}
function rateText(code,rate){
  if(code==='USD')return 'US$1 = HK$'+rate;
  if(code==='IDR')return 'HK$1 = Rp'+Number(rate).toLocaleString('en-GB');
  return '';
}

/* ── state + cache ─────────────────────────────────────── */
var S={tabs:{},entries:{},queue:[],cur:null,ready:false};
var server={tabs:null,entries:null};
var sync={db:null,mode:'connecting',busy:false,waiting:false};
(function loadCache(){try{var o=JSON.parse(lsGet(LS)||'null');if(o){S.tabs=o.tabs||{};S.entries=o.entries||{};S.queue=o.queue||[];S.cur=o.cur||null}}catch(e){}})();
function saveCache(){lsSet(LS,JSON.stringify({tabs:S.tabs,entries:S.entries,queue:S.queue,cur:S.cur}))}
if(Object.keys(S.tabs).length)S.ready=true;

function put(coll,id,data){
  if(data===null)delete S[coll][id];else S[coll][id]=data;
  enqueue(coll,id,data);saveCache();render();
}
function enqueue(coll,id,data){
  var key=coll+'/'+id;
  for(var i=S.queue.length-1;i>=0;i--){
    if(S.queue[i].key===key&&!(i===0&&sync.busy)){S.queue[i].data=data;return flush()}
  }
  S.queue.push({key:key,coll:coll,id:id,data:data});flush();
}
function flush(){
  if(!sync.db||sync.busy||!S.queue.length){renderSync();return}
  sync.busy=true;renderSync();
  var op=S.queue[0];var ref=sync.db.collection(op.coll).doc(op.id);
  var p=op.data===null?ref.delete():ref.set(op.data);
  p.then(function(){
    S.queue.shift();sync.busy=false;sync.waiting=false;saveCache();flush();
  },function(e){
    sync.busy=false;var code=e&&e.code;
    if(code==='invalid_argument'||code==='transform_error'){S.queue.shift();saveCache();toast('One change could not be saved. Open it and save again.','err');flush();return}
    if(code==='quota_exceeded'){toast('Storage is full. Delete an old tab, then try again.','err');renderSync();return}
    if(code==='revoked'||code==='not_granted'||code==='capability_disabled'||code==='capability_removed'){sync.db=null;sync.mode='local';renderSync();return}
    sync.waiting=true;renderSync();setTimeout(flush,4000+Math.random()*3000);
  });
}
function recompose(){
  if(server.tabs){S.tabs=Object.assign({},server.tabs)}
  if(server.entries){S.entries=Object.assign({},server.entries)}
  S.queue.forEach(function(q){if(!server[q.coll])return;if(q.data===null)delete S[q.coll][q.id];else S[q.coll][q.id]=q.data});
  if(server.tabs&&server.entries)S.ready=true;
  saveCache();render();
}
function subscribe(coll){
  sync.db.collection(coll).onSnapshot(function(snap){
    if(snap.metadata&&snap.metadata.fromCache&&snap.empty&&Object.keys(S[coll]).length)return;
    var m={};snap.docs.forEach(function(d){m[d.id]=d.data()});server[coll]=m;recompose();
  },function(e){
    var code=e&&e.code;
    if(code==='revoked'){sync.db=null;sync.mode='local';S.ready=true;render();return}
    setTimeout(function(){if(sync.db)subscribe(coll)},5000);
  });
}
function initDb(){
  var C=window.claude;
  if(!C||typeof C.use!=='function'){sync.mode='local';S.ready=true;render();return}
  C.use('db').then(function(db){
    if(!db){sync.mode='local';S.ready=true;render();return}
    sync.db=db;sync.mode='cloud';subscribe('tabs');subscribe('entries');flush();renderSync();
  },function(){sync.mode='local';S.ready=true;render()});
}
window.addEventListener('online',function(){flush()});

/* ── selectors ─────────────────────────────────────────── */
function tabList(){return Object.keys(S.tabs).map(function(k){return S.tabs[k]}).sort(function(a,b){return (b.start||'').localeCompare(a.start||'')||(b.createdAt||0)-(a.createdAt||0)})}
function currentTab(){
  var t=S.tabs[S.cur];
  if(!t){var l=tabList();t=l.filter(function(x){return !x.settled})[0]||l[0]||null;S.cur=t?t.id:null}
  return t;
}
function tabEntries(t){return Object.keys(S.entries).map(function(k){return S.entries[k]}).filter(function(e){return e.tabId===t.id})}
function pname(t,i){return t.people[i].name}
function last(t){try{return JSON.parse(lsGet('splitedb:last:'+t.id)||'{}')}catch(e){return {}}}
function setLast(t,o){lsSet('splitedb:last:'+t.id,JSON.stringify(o))}

/* ── render ────────────────────────────────────────────── */
var R1=104,R2=80,C1=2*Math.PI*R1,C2=2*Math.PI*R2;
function setSeg(el,C,start,frac){
  if(frac<=0.0005){el.style.strokeDasharray='0 '+C;el.style.strokeDashoffset='0';return}
  if(frac>=0.9995){el.style.strokeDasharray=C+' 0';el.style.strokeDashoffset='0';return}
  var len=Math.max(frac*C-2,0.5);
  el.style.strokeDasharray=len+' '+C;el.style.strokeDashoffset=String(-(start*C+1));
}
function render(){
  var t=S.ready?currentTab():null;
  $('#v-loading').hidden=S.ready;
  $('#v-empty').hidden=!S.ready||!!t;
  $('#v-tab').hidden=!t;
  $('#menu-tab').hidden=!t;
  $('#addbar').hidden=!t||!!t.settled;
  if(t)renderTab(t);
  renderSync();
}
/* ring segments: one per person on each ring, made once */
(function(){var h='';for(var k=0;k<2;k++)for(var i=0;i<MAXP;i++)h+='<circle class="seg" id="'+(k?'i':'o')+i+'" cx="120" cy="120" r="'+(k?R2:R1)+'" stroke-width="'+(k?8:22)+'" style="stroke:var(--p'+i+');stroke-dasharray:0 '+(k?C2:C1)+'"/>';$('#ring-g').innerHTML=h})();
function eqText(t,hk){if(!t.defCur||t.defCur==='HKD')return '';var eq=fromBase(hk,t.defCur,rateFor(t,t.defCur));if(t.defCur==='IDR')eq=Math.round(eq/1000)*1000;return '≈ '+fmt(eq,t.defCur)}
function renderTab(t){
  var root=document.documentElement;
  t.people.forEach(function(p,i){root.style.setProperty('--p'+i,p.colour)});
  var N=t.people.length;
  var list=tabEntries(t);var c=calc(list,N);
  $('#tab-title').textContent=t.name;
  /* meta line */
  var bits=[];
  if(t.start&&t.end){bits.push('<span class="mono">'+dmy(t.start)+' – '+dmy(t.end)+'</span>');var n=daysBetween(t.start,t.end)+1;var today=todayISO();if(today>=t.start&&today<=t.end)bits.push('<span>Day <span class="mono">'+(daysBetween(t.start,today)+1)+'</span> of <span class="mono">'+n+'</span></span>');else bits.push('<span><span class="mono">'+n+'</span> days</span>')}
  else if(t.start)bits.push('<span>From <span class="mono">'+dmy(t.start)+'</span></span>');
  if(t.settled)bits.push('<span class="pill pill-success">Settled</span>');
  $('#tab-meta').innerHTML=bits.join('');
  $('#settled-note').hidden=!t.settled;

  /* ring: outer = who paid, inner = whose share, one segment per person */
  var T=c.total,po=0,pi=0;
  for(var i=0;i<MAXP;i++){
    var fo=i<N&&T?c.paid[i]/T:0,fi=i<N&&T?c.share[i]/T:0;
    setSeg($('#o'+i),C1,po,fo);setSeg($('#i'+i),C2,pi,fi);po+=fo;pi+=fi;
  }
  /* centre: one payment squares the tab → "X owes Y"; more than one → the total, with the payments listed below */
  var tr=c.transfers,l,n,s='',zero=false;
  if(!c.nExp&&!c.nPay){l='No spending yet';n=fmt(0,'HKD');zero=true}
  else if(!tr.length){l='All square';n=fmt(0,'HKD');zero=true}
  else if(tr.length===1){l=pname(t,tr[0].from)+' owes '+pname(t,tr[0].to);n=fmt(tr[0].amt,'HKD');s=eqText(t,tr[0].amt)}
  else{l='Spent together';n=fmt(T,'HKD',{short:true});s=tr.length+' payments to settle'}
  $('#rc-l').textContent=l;var rn=$('#rc-n');rn.textContent=n;rn.classList.toggle('zero',zero);
  rn.style.fontSize=n.length>12?'21px':n.length>10?'25px':'';
  $('#rc-s').textContent=s;$('#rc-s').classList.toggle('txt',tr.length>1);
  $('#ring-t').textContent=T?(t.people.map(function(p,i){return p.name+' paid '+fmt(c.paid[i],'HKD')}).join(', ')+' of '+fmt(T,'HKD')+'. '+l+(tr.length===1?' '+n:'')+'.'):'No spending yet.';

  /* people: two tiles for a pair, a list for a group */
  var mx=Math.max.apply(null,c.paid.concat(c.share,[1]));var hasPay=c.nPay>0;
  var tiles=$('#tiles');tiles.classList.toggle('as-list',N>2);
  if(N===2)tiles.innerHTML=[0,1].map(function(i){
    var net=c.net[i];var lab=net>0?'Gets back':net<0?'Owes':'Even';
    return '<div class="ptile"><div class="ptile-h"><span class="sw" style="background:var(--p'+i+')"></span><h4>'+esc(pname(t,i))+'</h4></div>'+
      '<div class="kv"><span>Paid</span><span class="mono">'+fmt(c.paid[i],'HKD')+'</span></div>'+
      '<div class="b2"><span style="width:'+(c.paid[i]/mx*100).toFixed(1)+'%;background:var(--p'+i+')"></span></div>'+
      '<div class="kv"><span>Share</span><span class="mono">'+fmt(c.share[i],'HKD')+'</span></div>'+
      '<div class="b2 sh"><span style="width:'+(c.share[i]/mx*100).toFixed(1)+'%"></span></div>'+
      (hasPay&&c.back[i]?'<div class="kv"><span>Paid back</span><span class="mono">'+fmt(c.back[i],'HKD')+'</span></div>':'')+
      (hasPay&&c.recv[i]?'<div class="kv"><span>Received</span><span class="mono">'+fmt(c.recv[i],'HKD')+'</span></div>':'')+
      '<div class="net"><span>'+lab+'</span><span class="mono">'+fmt(Math.abs(net),'HKD')+'</span></div></div>';
  }).join('');
  else tiles.innerHTML='<ul class="plist">'+t.people.map(function(p,i){
    var net=c.net[i];var lab=net>0?'gets back':net<0?'owes':'even';
    var extra=(hasPay&&c.back[i]?' · paid back '+fmt(c.back[i],'HKD',{short:true}):'')+(hasPay&&c.recv[i]?' · received '+fmt(c.recv[i],'HKD',{short:true}):'');
    return '<li><span class="sw" style="background:var(--p'+i+')"></span><span class="pl-m"><span class="pl-n">'+esc(p.name)+'</span><span class="pl-s">Paid <span class="mono">'+fmt(c.paid[i],'HKD',{short:true})+'</span> · share <span class="mono">'+fmt(c.share[i],'HKD',{short:true})+'</span>'+extra+'</span></span>'+
      '<span class="pl-r"><span class="lab">'+lab+'</span><span class="mono'+(net?'':' zero')+'">'+fmt(Math.abs(net),'HKD')+'</span></span>'+
      '<span class="pl-bars" aria-hidden="true"><span class="b2"><span style="width:'+(c.paid[i]/mx*100).toFixed(1)+'%;background:var(--p'+i+')"></span></span><span class="b2 sh"><span style="width:'+(c.share[i]/mx*100).toFixed(1)+'%"></span></span></span></li>';
  }).join('')+'</ul><p class="vkey pl-key"><span>Bars: paid in each person’s colour, share in grey</span></p>';

  /* settle up (groups): the fewest payments that square everyone; tap one to record it */
  var st=$('#settle');st.hidden=!(N>2&&tr.length);
  if(!st.hidden)st.innerHTML='<div class="settle-h"><span>Settle up</span><span class="caption mono">'+tr.length+(tr.length===1?' payment':' payments')+'</span></div><ul class="rows">'+tr.map(function(x){
    return '<li><button class="srow" data-from="'+x.from+'" data-to="'+x.to+'" data-amt="'+x.amt+'"'+(t.settled?' disabled':'')+' aria-label="'+esc(pname(t,x.from))+' pays '+esc(pname(t,x.to))+' '+fmt(x.amt,'HKD')+(t.settled?'':'. Tap to record it')+'">'+
      '<span class="who"><span class="sw" style="background:var(--p'+x.from+')"></span><span class="nm">'+esc(pname(t,x.from))+'</span>'+icon('arrow-right','sm')+'<span class="sw" style="background:var(--p'+x.to+')"></span><span class="nm">'+esc(pname(t,x.to))+'</span></span><span class="mono">'+fmt(x.amt,'HKD')+'</span></button></li>';
  }).join('')+'</ul>'+(t.settled?'':'<p class="pnote">Tap a payment once it is made to record it.</p>');
  var days=t.start?Math.max(1,Math.min(daysBetween(t.start,t.end&&todayISO()>t.end?t.end:todayISO())+1,t.end?daysBetween(t.start,t.end)+1:9999)):1;
  $('#total-line').innerHTML=c.nExp?'<span>Spent together</span><span class="mono">'+fmt(T,'HKD')+(days>1&&todayISO()>=t.start?' · '+fmt(Math.round(T/days),'HKD',{short:true})+'/day':'')+'</span>':'';

  /* lower section */
  renderLower(t,list);
}
function joinNames(t,who){var a=who.map(function(i){return pname(t,i)});return a.length<2?a.join(''):a.slice(0,-1).join(', ')+' and '+a[a.length-1]}
function splitText(t,e){
  var s=e.split;if(!s)return '';var N=t.people.length;
  if(s.mode==='exact')return 'exact amounts';
  if(s.mode==='eq'){var w=s.who,k=w.length;
    if(k===1)return 'for '+pname(t,w[0]);
    if(k===N)return N===2?'half each':'shared by all '+N;
    if(k===2)return joinNames(t,w)+', half each';
    if(k===3)return 'shared by '+joinNames(t,w);
    return 'shared by '+k+' of '+N;
  }
  var a=s.a,p=s.who||[0,1];
  if(a===100)return 'for '+pname(t,p[0]);if(a===0)return 'for '+pname(t,p[1]);
  if(a===50)return N===2?'half each':joinNames(t,p)+', half each';
  return pname(t,p[0])+' '+a+'% · '+pname(t,p[1])+' '+(100-a)+'%';
}
function rowHTML(t,e){
  var p=t.people[e.payer];var dis=t.settled?' disabled':'';
  var av,title,sub;
  if(e.kind==='payment'){var to=payTo(e);av='<span class="av pay">'+icon('arrow-right','sm')+'</span>';title=e.desc||(pname(t,e.payer)+' paid '+pname(t,to)+' back');sub=esc(pname(t,e.payer))+' → '+esc(pname(t,to))}
  else{av='<span class="av" style="background:'+esc(p.colour)+';color:'+onColour(p.colour)+'">'+esc(p.name.charAt(0).toUpperCase())+'</span>';title=e.desc||'Expense';sub=esc(p.name)+' paid · '+esc(splitText(t,e))}
  return '<button class="rowb" data-id="'+esc(e.id)+'"'+dis+' aria-label="'+esc(title)+', '+esc(fmt(e.amount,e.cur))+'">'+av+
    '<span class="rb-m"><span class="rb-t">'+esc(title)+'</span><span class="rb-s">'+sub+'</span></span>'+
    '<span class="rb-a"><span class="mono a1">'+fmt(e.amount,e.cur)+'</span>'+(e.cur!=='HKD'?'<span class="mono a2">'+fmt(e.base,'HKD')+'</span>':'')+'</span></button>';
}
function renderSync(){
  var el=$('#sync'),line=$('#sync-line');if(!el)return;
  var pend=S.queue.length;
  if(sync.mode==='cloud'){el.textContent=pend?(sync.waiting?'Offline · '+pend+' unsaved':'Saving…'):'';line.textContent=pend?pend+' change'+(pend>1?'s':'')+' waiting to save. They are kept on this phone until then.':'Saved to your Claude account.'}
  else if(sync.mode==='local'){el.textContent='';line.textContent='Saved on this device only. Use Back up now and then to keep a copy.'}
  else{el.textContent='';line.textContent='Connecting…'}
}

/* ── lower section: entries · calendar · days (v0.4) ──────
   Every bar is coloured by who paid, in that person's colour.
   "Paid back" entries move money but are not spending, so they stay out of the calendar and days views. */
S.view=lsGet('splitedb:view')||'entries';if(['entries','cal','days'].indexOf(S.view)<0)S.view='entries';
S.calSel=null;
var MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function addDays(iso,n){var p=iso.split('-');return new Date(Date.UTC(+p[0],+p[1]-1,+p[2]+n)).toISOString().slice(0,10)}
function dow(iso){var p=iso.split('-');return new Date(Date.UTC(+p[0],+p[1]-1,+p[2])).getUTCDay()}   /* weeks start on Sunday (v0.5) */
function spendOf(list){return list.filter(function(e){return e.kind!=='payment'})}
function byDate(exp){var by={};exp.forEach(function(e){(by[e.date]=by[e.date]||[]).push(e)});return by}
function sumBase(arr){return arr.reduce(function(s,e){return s+e.base},0)}
/* the stretch of days to show: the tab's dates, widened to cover every expense; open-ended tabs run to the last expense (or today, when close) */
function tabRange(t,exp){
  var dates=exp.map(function(e){return e.date}).sort();
  var start=t.start||dates[0];if(!start)return null;
  if(dates.length&&dates[0]<start)start=dates[0];
  var last=dates.length?dates[dates.length-1]:start;
  var end=t.end||(last>start?last:start);
  if(!t.end){var today=todayISO();if(today>end&&daysBetween(start,today)<=62)end=today}
  if(last>end)end=last;
  if(daysBetween(start,end)>69)start=addDays(end,-69);
  return {start:start,end:end};
}
function payerFill(e){return 'var(--p'+e.payer+')'}
function legendHTML(t){return '<p class="vkey">'+t.people.map(function(p,i){return '<span><span class="sw" style="background:var(--p'+i+')"></span>'+esc(p.name)+' paid</span>'}).join('')+'</p>'}
function shareBtnHTML(){return '<button class="btn btn-ghost share-btn" data-share>'+icon('export')+'Share as picture</button>'}

function renderLower(t,list){
  var v=S.view;
  $$('#vtabs button').forEach(function(b){var on=b.dataset.v===v;b.classList.toggle('active',on);b.setAttribute('aria-selected',String(on))});
  $('#ledger').hidden=v!=='entries';$('#calview').hidden=v!=='cal';$('#daysview').hidden=v!=='days';
  $('#led-count').textContent=list.length?list.length+(list.length===1?' entry':' entries'):'';
  if(v==='entries')renderLedger(t,list);
  else if(v==='cal')renderCal(t,list);
  else renderDays(t,list);
}

function renderLedger(t,list){
  if(!list.length){$('#ledger').innerHTML='<div class="led-empty">'+(t.settled?'No entries on this tab.':'Add the first expense with the button below. Amounts can be in '+t.currencies.map(function(k){return CUR[k].sym}).join(', ')+'.')+'</div>';return}
  var byDay={};list.forEach(function(e){(byDay[e.date]=byDay[e.date]||[]).push(e)});
  $('#ledger').innerHTML=Object.keys(byDay).sort().reverse().map(function(d){
    var rows=byDay[d].sort(function(a,b){return (b.createdAt||0)-(a.createdAt||0)});
    var dayTotal=rows.reduce(function(s,e){return s+(e.kind==='payment'?0:e.base)},0);
    return '<div class="day"><div class="day-h"><span>'+dayName(d)+' <span class="mono">'+dmy(d)+'</span></span><span class="mono">'+(dayTotal?fmt(dayTotal,'HKD'):'')+'</span></div><ul class="rows">'+
      rows.map(function(e){return '<li>'+rowHTML(t,e)+'</li>'}).join('')+'</ul></div>';
  }).join('');
}

function renderCal(t,list){
  var box=$('#calview');var exp=spendOf(list);var rg=tabRange(t,exp);
  if(!rg||!exp.length){box.innerHTML='<div class="led-empty">The calendar fills in as you add expenses.</div>';return}
  var by=byDate(exp);
  var maxEv=Math.max.apply(null,exp.map(function(e){return e.base}));
  var g0=addDays(rg.start,-dow(rg.start)),g1=addDays(rg.end,6-dow(rg.end));
  var today=todayISO(),sel=S.calSel;
  if(!sel||sel<rg.start||sel>rg.end)sel=(today>=rg.start&&today<=rg.end&&by[today])?today:Object.keys(by).sort().pop();
  S.calSel=sel;
  var cells=[];
  for(var d=g0;d<=g1;d=addDays(d,1)){
    var p=d.split('-');var label=p[2]==='01'?'1 '+MONTHS[+p[1]-1]:String(+p[2]);
    if(d<rg.start||d>rg.end){cells.push('<span class="cal-cell off" aria-hidden="true"><span class="dn">'+label+'</span></span>');continue}
    var ev=(by[d]||[]).slice().sort(function(a,b){return b.base-a.base});
    var bars=ev.slice(0,4).map(function(e){return '<span class="mb" style="width:'+Math.max(10,Math.round(e.base/maxEv*100))+'%;background:'+payerFill(e)+'"></span>'}).join('');
    var more=ev.length>4?'<span class="more">+'+(ev.length-4)+'</span>':'';
    cells.push('<button class="cal-cell" data-d="'+d+'" aria-pressed="'+(d===sel)+'" aria-label="'+dayName(d)+' '+dmy(d)+', '+fmt(sumBase(ev),'HKD',{short:true})+', '+ev.length+(ev.length===1?' expense':' expenses')+'"><span class="dn">'+label+'</span><span class="mbs">'+bars+more+'</span></button>');
  }
  var sev=(by[sel]||[]).slice().sort(function(a,b){return (a.createdAt||0)-(b.createdAt||0)});
  var det='<div class="cal-det-h"><span>'+dayName(sel)+' <span class="mono">'+dmy(sel)+'</span> · '+sev.length+(sev.length===1?' expense':' expenses')+'</span><span class="mono">'+fmt(sumBase(sev),'HKD')+'</span></div>'+
    (sev.length?'<ul class="rows">'+sev.map(function(e){
      return '<li><button class="crow" data-id="'+esc(e.id)+'"'+(t.settled?' disabled':'')+'><span class="top"><span class="nm">'+esc(e.desc||'Expense')+'</span><span class="mono">'+fmt(e.amount,e.cur)+'</span></span>'+
        '<span class="bar" style="width:'+Math.max(4,Math.round(e.base/maxEv*100))+'%;background:'+payerFill(e)+'"></span>'+
        '<span class="sub">'+esc(pname(t,e.payer))+' paid · '+esc(splitText(t,e))+(e.cur!=='HKD'?' · '+fmt(e.base,'HKD'):'')+'</span></button></li>';
    }).join('')+'</ul>':'<div class="led-empty">Nothing spent on this day.</div>');
  box.innerHTML='<div class="cal-wd" aria-hidden="true"><span>S</span><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span></div><div class="cal-grid">'+cells.join('')+'</div>'+det+legendHTML(t)+shareBtnHTML();
}

function daysToShow(rg,by){var all=daysBetween(rg.start,rg.end)<=31;var ds=[];for(var d=rg.start;d<=rg.end;d=addDays(d,1)){if(all||by[d])ds.push(d)}return ds}
function renderDays(t,list){
  var box=$('#daysview');var exp=spendOf(list);var rg=tabRange(t,exp);
  if(!rg||!exp.length){box.innerHTML='<div class="led-empty">Days fill in as you add expenses.</div>';return}
  var by=byDate(exp);var ds=daysToShow(rg,by);
  var maxDay=Math.max.apply(null,ds.map(function(d){return sumBase(by[d]||[])}).concat([1]));
  box.innerHTML='<ul class="rows">'+ds.map(function(d){
    var ev=by[d]||[];var pb=zeros(t.people.length);ev.forEach(function(e){pb[e.payer]+=e.base});var tt=sumBase(ev);
    return '<li><button class="drow" data-d="'+d+'" aria-label="'+dayName(d)+' '+dmy(d)+', '+fmt(tt,'HKD',{short:true})+'"><span class="dl"><span class="wd">'+dayName(d)+(ev.length?' · '+ev.length:'')+'</span><span class="mono">'+dmy(d).slice(0,5)+'</span></span>'+
      '<span class="dbar"><span style="width:'+(tt?Math.max(3,Math.round(tt/maxDay*100)):0)+'%">'+pb.map(function(v,i){return v?'<i style="flex:'+v+';background:var(--p'+i+')"></i>':''}).join('')+'</span></span>'+
      '<span class="mono amt">'+(tt?fmt(tt,'HKD',{short:true}):'–')+'</span></button></li>';
  }).join('')+'</ul>'+legendHTML(t)+shareBtnHTML();
}

/* ── share as picture: drawn on a canvas, so it works offline and needs no library ── */
function rr(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}
function fitText(g,s,w){if(g.measureText(s).width<=w)return s;while(s.length>1&&g.measureText(s+'…').width>w)s=s.slice(0,-1);return s+'…'}
function makeShareImage(t){
  var N=t.people.length,list=tabEntries(t),exp=spendOf(list),c=calc(list,N),tr=c.transfers;
  var rg=tabRange(t,exp)||{start:t.start||todayISO(),end:t.end||t.start||todayISO()};
  var by=byDate(exp),ds=daysToShow(rg,by);if(ds.length>40)ds=ds.slice(-40);
  var maxDay=Math.max.apply(null,ds.map(function(d){return sumBase(by[d]||[])}).concat([1]));
  /* a pair keeps the one-line legend; a group gets two columns, and a list of payments when more than one is needed */
  var keyRows=N===2?1:Math.ceil(N/2),keyH=46,payH=52;
  var W=1080,M=48,X=M+56,R=W-M-56,rowH=60,H=600+ds.length*rowH+190+(keyRows-1)*keyH+(tr.length>1?tr.length*payH+12:0);
  var cv=document.createElement('canvas');cv.width=W;cv.height=H;var g=cv.getContext('2d');
  var cs=getComputedStyle(document.documentElement);function tok(n,f){return (cs.getPropertyValue(n)||'').trim()||f}
  var BG=tok('--bg','#050a0e'),SF=tok('--surface','#091622'),TX=tok('--text','#eaf4ff'),MU=tok('--muted-text','#6a90b8'),BD=tok('--border','#16293d');
  var col=t.people.map(function(p){return p.colour});
  var SERIF='"EB Garamond", Georgia, serif',MONO='"Fira Mono", Menlo, monospace',SANS='"Source Sans 3", -apple-system, sans-serif';
  var ready=document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve();
  return ready.then(function(){
    g.fillStyle=BG;g.fillRect(0,0,W,H);
    rr(g,M,M,W-2*M,H-2*M,24);g.fillStyle=SF;g.fill();g.strokeStyle=BD;g.lineWidth=2;g.stroke();
    var y=M+92;g.textBaseline='alphabetic';
    g.fillStyle=MU;g.font='500 26px '+SERIF;g.fillText('TRIP SPENDING',X,y);
    y+=84;g.fillStyle=TX;g.font='700 78px '+SERIF;g.fillText(fitText(g,t.name,R-X),X,y);
    var n=daysBetween(rg.start,rg.end)+1;
    y+=52;g.fillStyle=MU;g.font='28px '+MONO;g.fillText(dmy(rg.start)+' – '+dmy(rg.end)+' · '+n+(n===1?' day':' days'),X,y);
    y+=96;g.fillStyle=TX;g.font='600 66px '+MONO;g.fillText(fmt(c.total,'HKD',{short:true}),X,y);
    y+=62;
    var colW=(R-X)/2;
    t.people.forEach(function(p,i){
      var x=X+(i%2)*colW,yy=y+(N===2?0:Math.floor(i/2)*keyH);
      g.fillStyle=col[i];rr(g,x,yy-22,24,24,4);g.fill();g.fillStyle=TX;
      if(N===2){g.font='30px '+SANS;var lab=p.name+' paid';g.fillText(lab,x+38,yy);var lw=g.measureText(lab).width;g.font='30px '+MONO;g.fillText(fmt(c.paid[i],'HKD',{short:true}),x+38+lw+14,yy);return}
      var amt=fmt(c.paid[i],'HKD',{short:true});g.font='28px '+MONO;var aw=g.measureText(amt).width;var right=i%2?R:x+colW-32;
      g.fillText(amt,right-aw,yy);g.font='28px '+SANS;var room=right-aw-(x+38)-16;var nm=p.name+' paid';g.fillText(g.measureText(nm).width<=room?nm:fitText(g,p.name,room),x+38,yy);
    });
    y+=(keyRows-1)*keyH;
    y+=40;g.fillStyle=BD;g.fillRect(X,y,R-X,2);y+=50;
    var bx=X+190,bw=R-X-190-210;
    ds.forEach(function(d){
      var ev=by[d]||[];var pb=zeros(N);ev.forEach(function(e){pb[e.payer]+=e.base});var tt=sumBase(ev);
      g.fillStyle=MU;g.font='26px '+MONO;g.fillText(dayName(d)+' '+dmy(d).slice(0,5),X,y);
      g.fillStyle=BD;rr(g,bx,y-24,bw,26,6);g.fill();
      var w=tt?Math.max(6,tt/maxDay*bw):0,x=bx,lastI=-1;pb.forEach(function(v,i){if(v)lastI=i});
      pb.forEach(function(v,i){if(!v)return;var sw=w*v/tt;g.fillStyle=col[i];g.fillRect(x,y-24,Math.max(0,sw-(i<lastI?2:0)),26);x+=sw});
      g.fillStyle=tt?TX:MU;g.font='28px '+MONO;g.textAlign='right';g.fillText(tt?fmt(tt,'HKD',{short:true}):'–',R,y);g.textAlign='left';
      y+=rowH;
    });
    y+=6;g.fillStyle=BD;g.fillRect(X,y-30,R-X,2);y+=40;
    if(tr.length<=1){
      var owe=!tr.length?'All square':pname(t,tr[0].from)+' owes '+pname(t,tr[0].to);
      g.fillStyle=TX;g.font='500 44px '+MONO;var ow=tr.length?g.measureText(fmt(tr[0].amt,'HKD')).width:0;
      g.font='34px '+SANS;g.fillText(fitText(g,owe,R-X-ow-24),X,y);
      if(tr.length){g.font='500 44px '+MONO;g.textAlign='right';g.fillText(fmt(tr[0].amt,'HKD'),R,y);g.textAlign='left'}
    }else{
      g.fillStyle=TX;g.font='34px '+SANS;g.fillText('To settle up',X,y);
      g.fillStyle=MU;g.font='26px '+MONO;g.textAlign='right';g.fillText(tr.length+' payments',R,y);g.textAlign='left';
      y+=12;
      tr.forEach(function(p){
        y+=payH;g.font='30px '+MONO;var am=fmt(p.amt,'HKD');var aw=g.measureText(am).width;g.fillStyle=TX;g.textAlign='right';g.fillText(am,R,y);g.textAlign='left';
        var half=(R-X-aw-24-60)/2,x=X;g.font='30px '+SANS;
        g.fillStyle=col[p.from];rr(g,x,y-22,22,22,4);g.fill();g.fillStyle=TX;var a=fitText(g,pname(t,p.from),half-34);g.fillText(a,x+34,y);x+=34+g.measureText(a).width+16;
        g.fillStyle=MU;g.fillText('→',x,y);x+=g.measureText('→').width+16;
        g.fillStyle=col[p.to];rr(g,x,y-22,22,22,4);g.fill();g.fillStyle=TX;g.fillText(fitText(g,pname(t,p.to),half-34),x+34,y);
      });
    }
    g.fillStyle=MU;g.font='24px '+SANS;g.fillText('Made with Splitedb',X,H-M-36);
    return new Promise(function(res){cv.toBlob(function(b){res(b)},'image/png')});
  });
}
function shareSheet(){

  openSheet('Share picture','<div class="share-prev" id="sp-prev"><p class="pnote">Drawing the picture…</p></div>',function(sh){
    makeShareImage(t).then(function(blob){

      if(!canShare){sv.classList.remove('btn-ghost');sv.classList.add('btn-primary')}
      sb.addEventListener('click',function(){navigator.share({files:[file],title:t.name}).catch(function(){})});
      sv.addEventListener('click',function(){
        if(window.claude){if(DL)DL.save({filename:name,data:blob}).then(function(){toast('Picture saved · '+name)},function(e){if(!e||e.code!=='declined')toast('The picture could not be saved.','err')});return}
        var a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){a.remove()},1500);toast('Picture saved · '+name);

/* ── entry sheet (add / edit) ──────────────────────────── */
/* v0.3: one screen on a phone, blinking caret on the amount, delete key repeats when held.

function entrySheet(e,pre){

  var ALL=t.people.map(function(_,i){return i});
  var curs=CUR_ORDER.filter(function(k){return t.currencies.indexOf(k)>=0});
  var orig=isEdit&&e.split?e.split:null;
  var startA=50;
  if(orig&&orig.mode!=='eq')startA=orig.mode==='exact'?(e.amount?Math.round(orig.a/e.amount*100):50):orig.a;
  var lp=(L.payer>=0&&L.payer<N)?L.payer:0;
  var d=isEdit?{kind:e.kind,cur:e.cur,desc:e.desc||'',payer:e.payer,to:e.kind==='payment'?payTo(e):(e.payer?0:1),who:orig?splitWho(e):ALL.slice(),a:startA,date:e.date}
    :{kind:'expense',cur:curs.indexOf(L.cur)>=0?L.cur:(t.defCur||'HKD'),desc:'',payer:lp,to:lp?0:1,who:ALL.slice(),a:50,date:todayISO()};
  if(pre&&!isEdit){d.kind=pre.kind||'payment';if(pre.payer!=null)d.payer=pre.payer;if(pre.to!=null)d.to=pre.to}
  if(d.who.length!==2)d.a=50;
  var splitTouched=false,prefill=null;
  var descs=[];tabEntries(t).sort(function(a,b){return (b.createdAt||0)-(a.createdAt||0)}).forEach(function(x){if(x.desc&&descs.indexOf(x.desc)<0&&descs.length<30)descs.push(x.desc)});
  var P=t.people;
  function who(i){return '<span class="sw" style="background:var(--p'+i+')"></span><span>'+esc(P[i].name)+'</span>'}

  var body=

    (curs.length>1?'<div class="segmented big" role="group" aria-label="Currency" id="f-cur">'+curs.map(function(k){return '<button data-c="'+k+'">'+CUR[k].sym+'</button>'}).join('')+'</div>':'')+'</div>'+
    '<div><div class="amt-wrap" id="f-amtw"><span class="amt-sym" id="f-sym"></span>'+amtHTML+'</div>'+
    '<p class="conv" id="f-conv"></p><p class="error-msg" id="f-amt-err" hidden></p></div>'+
